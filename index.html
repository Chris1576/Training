  setTimeout(function(){ el.remove(); }, 4600);
}
function fireworks(){
  var old=document.querySelector(".fw"); if(old) old.remove();
  var cv=document.createElement("canvas");
  cv.className="fw";
  document.body.appendChild(cv);
  var dpr=Math.min(window.devicePixelRatio||1, 2), W=window.innerWidth, H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  var ctx=cv.getContext("2d");
  ctx.scale(dpr, dpr);
  var rockets=[], sparks=[], start=performance.now(),
    launches=[0,300,600,900,1250,1600,1950,2300,2650,3000,3350,3450,3550];
  function launch(){
    rockets.push({ x:W*(0.18+Math.random()*0.64), y:H+10, vx:(Math.random()-0.5)*1.6,
      vy:-(H/62)-Math.random()*2.4, color:FW_COLORS[Math.floor(Math.random()*3)] });
  }
  function burst(x, y){
    var n=70+Math.floor(Math.random()*30), main=FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
    for(var i=0;i<n;i++){
      var a=Math.PI*2*i/n+Math.random()*0.2, sp=1.6+Math.random()*4.4;
      sparks.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1,
        decay:0.011+Math.random()*0.012, color:Math.random()<0.75?main:"#F2F0EC", r:1.2+Math.random()*1.4 });
    }
  }
  function frame(now){
    var t=now-start;
    while(launches.length && t>=launches[0]){ launches.shift(); launch(); }
    ctx.globalCompositeOperation="destination-out";
    ctx.fillStyle="rgba(0,0,0,0.22)";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    rockets=rockets.filter(function(r){
      r.x+=r.vx; r.y+=r.vy; r.vy+=0.16;
      ctx.fillStyle=r.color;
      ctx.beginPath(); ctx.arc(r.x, r.y, 2, 0, Math.PI*2); ctx.fill();
      if(r.vy>=-1.2){ burst(r.x, r.y); return false; }
      return true;
    });
    sparks=sparks.filter(function(p){
      p.vx*=0.975; p.vy=p.vy*0.975+0.05;
      p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
      if(p.life<=0) return false;
      ctx.globalAlpha=Math.max(0, p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      return true;
    });
    ctx.globalAlpha=1;
    if(launches.length || rockets.length || sparks.length) requestAnimationFrame(frame);
    else cv.remove();
  }
  requestAnimationFrame(frame);
}

var SET_COUNT_MAX=10;
function addDraftSet(exId){
  flushDraftFromDom();
  var arr=S.draft.entries[exId] || (S.draft.entries[exId]=[]);
  if(arr.length>=SET_COUNT_MAX){ toast("Höchstens "+SET_COUNT_MAX+" Sätze"); return; }
  arr.push(emptySetSlot());
  parkDraft(); saveDraftSoon(); render();
}
function trimSessionSets(date, unitId, exId, count){
  var existing=sessionFor(date, unitId);
  if(!existing || !existing.sets || !existing.sets[exId] || existing.sets[exId].length<=count) return false;
  var sets=cloneSetsMap(existing.sets);
  sets[exId]=sets[exId].slice(0, count);
  var now=Date.now();
  S.data.sessions=S.data.sessions.filter(function(sess){ return !(sess.date===date && sess.unit===unitId); });
  S.data.sessions.push({ id:existing.id||(date+"-"+unitId), date:date, unit:unitId,
    week:existing.week, stufe:existing.stufe||"A", sets:sets, savedAt:now });
  S.data.sessions=mergeSessions(S.data.sessions, S.data.sessions);
  S.data.updatedAt=now;
  return true;
}
function removeDraftSet(exId){
  flushDraftFromDom();
  var arr=S.draft.entries[exId];
  if(!arr || arr.length<=1){ toast("Mindestens ein Satz"); return; }
  var lastI=arr.length-1, saved=savedSetAt(exId, lastI);
  if((setHasValue(arr[lastI]) || setHasValue(saved)) && !confirm("Letzten Satz wirklich entfernen?")) return;
  arr.pop();
  _pendingSaved=_pendingSaved.filter(function(p){
    return !(p.date===S.draft.date && p.unit===S.draft.unitId && p.ex===exId && p.index>=arr.length);
  });
  var changed=trimSessionSets(S.draft.date, S.draft.unitId, exId, arr.length);
  parkDraft(); persistAllNow(); render();
  if(changed) syncSoon(); else saveDraftSoon();
}
function removeExtra(exId){
  var d=S.draft, sess=sessionFor(d.date, d.unitId);
  if(sess && filledSets(sess.sets && sess.sets[exId]).length){
    toast("Gespeicherte Sätze bleiben im Verlauf – Übung bleibt heute sichtbar");
    return;
  }
  d.extra=(d.extra||[]).filter(function(x){ return x!==exId; });
  if(d.extraCfg) delete d.extraCfg[exId];
  delete d.entries[exId];
  parkDraft(); saveDraftSoon(); render();
}
function applySuggestion(exId, kg){
  flushDraftFromDom();
  (S.draft.entries[exId]||[]).forEach(function(s,i){
    if((s.kg==="" || s.kg==null) && !isRowDone(exId,i,s)){ s.kg=String(kg); s.dirty=true; }
  });
  S.collapsed[exId]=false;
  parkDraft(); saveDraftSoon(); render();
}

/* ---------- Plan bearbeiten ---------- */
function touchPlan(){
  var now=Date.now();
  S.data.plan.updatedAt=now;
  S.data.updatedAt=Math.max(Number(S.data.updatedAt)||0, now);
  refreshDraft();
  syncSoon();
}
function planUnit(p, unitId){ for(var i=0;i<p.units.length;i++) if(p.units[i].id===unitId) return p.units[i]; return null; }
function planMove(unitId, exId, dir){
  var u=planUnit(editablePlan(), unitId); if(!u) return;
  var i=u.ex.findIndex(function(e){ return e.id===exId; }), j=i+dir;
  if(i<0 || j<0 || j>=u.ex.length) return;
  var t=u.ex[i]; u.ex[i]=u.ex[j]; u.ex[j]=t;
  touchPlan(); render();
}
function planDelete(unitId, exId){
  var u=planUnit(editablePlan(), unitId); if(!u) return;
  var ex=u.ex.find(function(e){ return e.id===exId; }); if(!ex) return;
  if(!confirm("„"+ex.name+"“ aus Day "+u.n+" entfernen? Bisherige Einträge bleiben im Verlauf.")) return;
  u.ex=u.ex.filter(function(e){ return e.id!==exId; });
  S.planEdit=null;
  touchPlan(); render(); toast("Übung entfernt");
}
function fieldVal(id){ var e=document.getElementById(id); return e ? e.value : ""; }
function cleanRange(sets, min, max){
  sets=Math.min(10, Math.max(1, intOrNull(sets)||3));
  min=intOrNull(min); max=intOrNull(max);
  if(min!=null && max==null) max=min;
  if(max!=null && min==null) min=max;
  if(min!=null && max!=null && max<min){ var t=min; min=max; max=t; }
  return {sets:sets, min:min, max:max};
}
function planSave(unitId, exId){
  var u=planUnit(editablePlan(), unitId); if(!u) return;
  var ex=u.ex.find(function(e){ return e.id===exId; }); if(!ex) return;
  var r=cleanRange(fieldVal("peSets"), fieldVal("peMin"), fieldVal("peMax"));
  var oldSets=ex.sets||3;
  ex.sets=r.sets;
  var cur=S.draft && S.draft.unitId===unitId && S.draft.entries[exId];
  if(cur && cur.length===oldSets){
    while(cur.length<r.sets) cur.push(emptySetSlot());
    while(cur.length>r.sets && !setHasValue(cur[cur.length-1]) && !setHasValue(savedSetAt(exId, cur.length-1))) cur.pop();
  }
  if(r.min==null){ delete ex.min; delete ex.max; } else { ex.min=r.min; ex.max=r.max; }
  ex.pause=String(fieldVal("pePause")||"").trim();
  var w=document.getElementById("peWarm"); ex.warm=!!(w && w.checked);
  delete ex.scheme;
  S.planEdit=null;
  touchPlan(); render(); toast("Plan gespeichert");
}
function planReset(){
  if(!confirm("Standardplan wiederherstellen? Eigene Änderungen am Plan gehen verloren, der Verlauf bleibt.")) return;
  var lib=(S.data.plan && S.data.plan.lib) || {};
  S.data.plan={ units:clone(DEFAULT_UNITS), lib:lib, updatedAt:Date.now() };
  S.planEdit=null;
  touchPlan(); render(); toast("Standardplan wiederhergestellt");
}
function confirmAdd(){
  var sh=S.sheet, u=unitById(sh.unitId), id=sh.pick;
  var r=cleanRange(fieldVal("addSets"), fieldVal("addMin"), fieldVal("addMax"));
  var scopeEl=document.querySelector("input[name='scope']:checked");
  var scope = sh.mode==="plan" ? "plan" : (scopeEl ? scopeEl.value : "today");
  if(id==="__new"){
    var name=String(fieldVal("newName")||"").trim();
    if(!name){ toast("Bitte einen Namen eingeben"); return; }
    var kind=fieldVal("newKind")||"kg";
    id="c_"+slug(name)+"_"+Date.now().toString(36).slice(-4);
    var entry={ label:name, incr:kind==="kg"?2.5:kind==="m"?2:0, step:kind==="kg"?2.5:1 };
    if(kind!=="kg" && kind!=="m") entry.bw=true;
    if(kind==="s" || kind==="m" || kind==="kcal") entry.repLabel=kind;
    editablePlan().lib[id]=entry;
    S.data.plan.updatedAt=Date.now();
  }
  var m=metaOf(id);
  if(scope==="plan"){
    var pu=planUnit(editablePlan(), u.id);
    var def={ id:id, name:exLabel(id), sets:r.sets, rir:"", pause:"1,5 Min" };
    if(r.min!=null){ def.min=r.min; def.max=r.max; }
    if(m.repLabel) def.repLabel=m.repLabel;
    pu.ex.push(def);
    if(S.draft && S.draft.unitId===u.id){
      S.draft.extra=(S.draft.extra||[]).filter(function(x){ return x!==id; });
    }
    touchPlan();
  } else {
    var d=S.draft;
    d.extra=(d.extra||[]).filter(function(x){ return x!==id; }).concat([id]);
    d.extraCfg=d.extraCfg||{};
    d.extraCfg[id]={ sets:r.sets, min:r.min, max:r.max };
    if(id.indexOf("c_")===0) syncSoon();
  }
  if(S.draft && S.draft.unitId===u.id){
    if(!S.draft.entries[id] || !S.draft.entries[id].length) S.draft.entries[id]=emptySlots(r.sets);
    S.collapsed[id]=false;
    parkDraft(); saveDraftSoon();
  }
  closeSheet(); render();
  toast(scope==="plan" ? "Dauerhaft zu Day "+u.n+" hinzugefügt" : "Für heute hinzugefügt");
  if(sh.mode==="training"){
    var card=document.querySelector("[data-card='"+id+"']");
    if(card) card.scrollIntoView({block:"center", behavior:"smooth"});
  }
}

/* ---------- Daten ---------- */
function downloadFile(name, text, mime){
  try{
    var blob=new Blob(["\ufeff"+text],{type:mime});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    return true;
  }catch(e){ return false; }
}
function downloadCsv(){
  var lines=["Datum;Woche;Einheit;Uebung;Satz;Wdh;kg;RIR"];
  trainedSessions().forEach(function(s){
    Object.keys(s.sets||{}).forEach(function(ex){
      (s.sets[ex]||[]).forEach(function(x,i){
        if(!setHasValue(x)) return;
        lines.push([s.date,s.week,s.unit,exLabel(ex),i+1,x.reps,x.kg,x.rir].join(";"));
      });
    });
  });
  if(downloadFile("Trainingslog.csv", lines.join("\n"), "text/csv;charset=utf-8")) toast("CSV gespeichert");
  else toast("Download nicht möglich");
}
function downloadBackup(){
  var name="Trainingslog-Sicherung-"+today()+".json";
  if(downloadFile(name, JSON.stringify(S.data,null,1), "application/json")) toast("Sicherung gespeichert");
  else toast("Download nicht möglich");
}
function forceServer(){
  if(!confirm("Den Stand vom Server übernehmen? Nicht abgeglichene Änderungen auf DIESEM Gerät werden überschrieben.")) return;
  ghStatus("Lade …");
  ghFetch().then(function(remote){
    if(!remote || !Array.isArray(remote.sessions)){ toast("Auf dem Server liegt noch nichts"); return; }
    S.data={ startDate:remote.startDate||null, sessions:remote.sessions, updatedAt:remote.updatedAt||0,
      wipedAt:remote.wipedAt||0, plan:remote.plan||undefined };
    if(!S.data.plan) delete S.data.plan;
    GH.lastSync=new Date().toISOString();
    store.set(GHKEY, GH);
    return persist().then(function(){
      refreshDraft();
      ghStatus("Server-Stand übernommen · "+timeShort(new Date()));
      render(); toast("Server-Stand übernommen");
    });
  }).catch(function(e){ ghStatus("Fehlgeschlagen: "+e.message); toast(e.message); });
}
function clearAll(){
  if(!confirm("Alle erfassten Einheiten löschen? Das gilt für jedes Gerät mit diesem Login und lässt sich nicht rückgängig machen. Der Plan bleibt erhalten.")) return;
  var now=Date.now();
  S.data={ startDate:null, sessions:[], updatedAt:now, wipedAt:now, plan:S.data.plan };
  if(!S.data.plan) delete S.data.plan;
  S.drafts={};
  clearTimeout(_draftTimer);
  var unit=S.draft ? S.draft.unitId : suggestedUnit();
  store.del(DRAFTKEY).then(function(){ return persist(); }).then(function(){
    buildDraft(unit, "A", today());
    return ghPut(S.data);
  }).then(function(){
    GH.lastSync=new Date().toISOString();
    store.set(GHKEY, GH);
    closeSheet(); render(); toast("Alle Trainingsdaten gelöscht");
  }).catch(function(e){ toast(e && e.message ? e.message : "Löschen fehlgeschlagen"); });
}

/* ---------- Ereignisse ---------- */
document.addEventListener("pointerdown", function(ev){
  var el=ev.target.closest && ev.target.closest("[data-saveset]");
  if(!el) return;
  ev.preventDefault();
  var sp=el.getAttribute("data-saveset").split("|");
  saveSet(sp[0], Number(sp[1]));
}, true);

var CLICK_SEL="[data-tab],[data-unit],[data-saveset],[data-addset],[data-rmset],[data-rmextra],[data-collapse],[data-bump],[data-sug],"+
  "[data-open],[data-close],[data-cal],[data-metric],[data-openday],[data-hist],[data-pmove],[data-pdel],[data-pedit],[data-psave],"+
  "[data-pcancel],[data-padd],[data-pick],[data-cat],[data-addback],[data-addok],[data-saveall],[data-finish],"+
  "#planReset,#ghUp,#ghForce,#backupBtn,#exportBtn,#clearBtn,#animTest";

document.addEventListener("click", function(ev){
  var el=ev.target.closest ? ev.target.closest(CLICK_SEL) : null;
  if(!el) return;
  var v;

  if(el.hasAttribute("data-close")){
    if(el.classList.contains("sheet-back") && ev.target!==el) return;
    closeSheet(); return;
  }
  if((v=el.getAttribute("data-tab"))){
    flushDraftFromDom(); parkDraft(); saveDraftSoon();
    S.tab=v; S.planEdit=null; render(); window.scrollTo(0,0); return;
  }
  if((v=el.getAttribute("data-unit"))){
    if(v!==S.draft.unitId){ showUnit(v, S.draft.stufe, S.draft.date); rememberUnit(v); saveDraftSoon(); render(); }
    return;
  }
  if((v=el.getAttribute("data-saveset"))){ var sp=v.split("|"); saveSet(sp[0], Number(sp[1])); return; }
  if((v=el.getAttribute("data-addset"))){ addDraftSet(v); return; }
  if((v=el.getAttribute("data-rmset"))){ removeDraftSet(v); return; }
  if((v=el.getAttribute("data-rmextra"))){ removeExtra(v); return; }
  if((v=el.getAttribute("data-collapse"))){ flushDraftFromDom(); S.collapsed[v]=!isExCollapsed(v); render(); return; }
  if((v=el.getAttribute("data-sug"))){ var sg=v.split("|"); applySuggestion(sg[0], Number(sg[1])); return; }
  if((v=el.getAttribute("data-bump"))){
    var q=v.split("|"), ex=q[0], i=Number(q[1]), field=q[2], dir=Number(q[3]), step=Number(q[4]);
    var st=ensureDraftSlot(ex, i);
    var input=document.querySelector("[data-in='"+ex+"|"+i+"|"+field+"']");
    var curS=normalizeNum(input ? input.value : st[field]), next;
    if(curS===""){
      var ph=input ? Number(normalizeNum(input.placeholder)) : NaN;
      next = !isNaN(ph) && input && normalizeNum(input.placeholder)!=="" ? ph : Math.max(0, dir*step);
    } else {
      next=Math.max(0, Math.round((Number(curS)+dir*step)*100)/100);
    }
    st[field]=String(next); st.dirty=true;
    if(input) input.value=st[field];
    patchTraining(); saveDraftSoon(); return;
  }
  if((v=el.getAttribute("data-open"))){
    flushDraftFromDom();
    if(v==="settings") openSheet({type:"settings"});
    else if(v==="summary") openSheet({type:"summary"});
    else if(v==="add") openSheet({type:"add", unitId:S.draft.unitId, mode:"training", pick:null, q:""});
    if(v==="add"){ var qi=document.getElementById("addQ"); if(qi && window.innerWidth>700) qi.focus(); }
    return;
  }
  if((v=el.getAttribute("data-padd"))){ openSheet({type:"add", unitId:v, mode:"plan", pick:null, q:""}); return; }
  if((v=el.getAttribute("data-pick"))){ S.sheet.pick=v; renderSheet(); return; }
  if(el.hasAttribute("data-cat") && S.sheet){
    S.sheet.cat=el.getAttribute("data-cat");
    var ac=document.getElementById("addCats"); if(ac) ac.innerHTML=addCatsHTML();
    var al=document.getElementById("addList"); if(al) al.innerHTML=addListHTML();
    return;
  }
  if(el.hasAttribute("data-addback")){ S.sheet.pick=null; renderSheet(); return; }
  if(el.hasAttribute("data-addok")){ confirmAdd(); return; }
  if(el.hasAttribute("data-saveall")){
    var n=0;
    dayExercises(S.draft.unitId, S.draft.date, S.draft).forEach(function(ex){
      (S.draft.entries[ex.id]||[]).forEach(function(s,i){
        if(setFilled(s, ex.id) && !isRowDone(ex.id,i,s) && saveSet(ex.id, i, true)) n++;
      });
    });
    renderSheet(); render();
    toast(n+(n===1?" Satz":" Sätze")+" gespeichert");
    return;
  }
  if(el.hasAttribute("data-finish")){
    closeSheet(); S.collapsed={}; render(); window.scrollTo(0,0);
    toast("Einheit abgeschlossen");
    return;
  }
  if((v=el.getAttribute("data-cal"))){
    var base=S.calMonth || today().slice(0,7);
    var dt=new Date(Number(base.slice(0,4)), Number(base.slice(5,7))-1+Number(v), 1, 12);
    S.calMonth=dt.getFullYear()+"-"+pad2(dt.getMonth()+1);
    render(); return;
  }
  if((v=el.getAttribute("data-metric"))){ S.metric=v; render(); return; }
  if((v=el.getAttribute("data-openday"))){
    var od=v.split("|");
    showUnit(od[1], "A", od[0]); rememberUnit(od[1]);
    S.tab="training"; render(); window.scrollTo(0,0); return;
  }
  if((v=el.getAttribute("data-hist"))){
    S.verlaufEx=v; S.tab="verlauf"; render();
    var c=document.getElementById("excard"); if(c) c.scrollIntoView({block:"start"});
    return;
  }
  if((v=el.getAttribute("data-pmove"))){ var pm=v.split("|"); planMove(pm[0], pm[1], Number(pm[2])); return; }
  if((v=el.getAttribute("data-pdel"))){ var pd=v.split("|"); planDelete(pd[0], pd[1]); return; }
  if((v=el.getAttribute("data-pedit"))){ S.planEdit = S.planEdit===v ? null : v; render(); return; }
  if((v=el.getAttribute("data-psave"))){ var ps=v.split("|"); planSave(ps[0], ps[1]); return; }
  if(el.hasAttribute("data-pcancel")){ S.planEdit=null; render(); return; }
  if(el.id==="planReset"){ planReset(); return; }
  if(el.id==="ghUp"){ syncUp(false).catch(function(){}); return; }
  if(el.id==="ghForce"){ forceServer(); return; }
  if(el.id==="backupBtn"){ downloadBackup(); return; }
  if(el.id==="exportBtn"){ downloadCsv(); return; }
  if(el.id==="clearBtn"){ clearAll(); return; }
  if(el.id==="animTest"){
    closeSheet();
    var demo=unitById(S.draft.unitId).ex[0];
    celebrate(demo ? demo.id : "back_squat", {kg:"100", reps:"5"}, {kg:"97.5", reps:"5"});
    return;
  }
});

function applyDraftInput(t){
  var v=t.getAttribute && t.getAttribute("data-in");
  if(!v || !S.draft) return false;
  var p=v.split("|"), slot=ensureDraftSlot(p[0], Number(p[1]));
  if(!slot) return false;
  slot[p[2]]=t.value; slot.dirty=true;
  return true;
}
document.addEventListener("input", function(ev){
  var t=ev.target;
  if(applyDraftInput(t)){ patchTraining(); saveDraftSoon(); return; }
  if(t.id==="addQ" && S.sheet){
    S.sheet.q=t.value;
    var l=document.getElementById("addList"); if(l) l.innerHTML=addListHTML();
    return;
  }
});
document.addEventListener("change", function(ev){
  var t=ev.target;
  if(applyDraftInput(t)){ patchTraining(); saveDraftSoon(); return; }
  if(t.id==="dateInput" && t.value){
    showUnit(S.draft.unitId, S.draft.stufe, t.value); saveDraftSoon(); render(); return;
  }
  if(t.id==="exSelect"){ S.verlaufEx=t.value; render(); return; }
  if(t.id==="hsToggle"){
    try { localStorage.setItem(HSKEY, t.checked ? "on" : "off"); } catch(e){}
    toast(t.checked ? "Handschlag-Animation an" : "Handschlag-Animation aus");
    return;
  }
  if(t.id==="importFile"){
    var f=t.files && t.files[0];
    if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var obj=JSON.parse(r.result);
        if(!obj || !Array.isArray(obj.sessions)) throw new Error("Format");
        if(!confirm("Sicherung mit "+obj.sessions.length+" Einheiten laden? Die aktuellen Daten auf diesem Gerät werden ersetzt.")) return;
        S.data={ startDate:obj.startDate||null, sessions:obj.sessions, plan:obj.plan||S.data.plan };
        if(!S.data.plan) delete S.data.plan;
        persist().then(function(){ refreshDraft(); closeSheet(); render(); toast("Sicherung geladen"); });
      }catch(e){ toast("Datei nicht lesbar"); }
    };
    r.readAsText(f);
  }
});
document.addEventListener("keydown", function(ev){
  if(ev.key==="Escape" && S.sheet){ closeSheet(); return; }
  if(ev.key==="Enter" && ev.target && ev.target.getAttribute && ev.target.getAttribute("data-in")){
    ev.target.blur();
  }
});

/* ============================================================
   START
   ============================================================ */
initStorage()
  .then(function(){ return store.get(GHKEY); })
  .then(function(cfg){
    if(cfg){ GH.lastSync=cfg.lastSync||null; }
    return store.get(KEY);
  })
  .then(function(saved){
    if(saved && saved.sessions){
      S.data=saved;
      S.data.sessions=mergeSessions(S.data.sessions, S.data.sessions);
    }
    STORE_READY=true;
    return store.get(DRAFTKEY).then(function(d){ return d || store.get("gk3:draft-v2"); });
  })
  .then(function(draft){
    adoptDraftStore(draft);
    if(S.draft && draftValid(S.draft)){
      var parked=S.draft;
      buildDraft(parked.unitId, parked.stufe, parked.date, parked);
      ensureTodayDraft();
    } else {
      buildDraft(suggestedUnit(), "A", today());
    }
    render();
    syncUp(true).catch(function(){});
  });

function flushOnLeave(){ persistAllNow(); }
window.addEventListener("pagehide", flushOnLeave);
window.addEventListener("beforeunload", flushOnLeave);
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="hidden"){ flushOnLeave(); return; }
  if(document.visibilityState==="visible"){
    if(ensureTodayDraft()) render();
    if(Date.now() - _lastSaveAt < 8000) return;
    syncUp(true).catch(function(){});
  }
});
</script>
