<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="app-version" content="2026-09-08-save-hard">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E1110">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<title>Trainingslog — Pull · Push · Leg</title>
<style>
:root{
  color-scheme:dark;
  --ink:#E8ECE9; --mut:#8B948E; --line:#2B322E; --line2:#222825;
  --bg:#0E1110; --panel:#171B19; --sunk:#121615;
  --a1:#4FC8B4; --a1s:#122B28;
  --a2:#E08356; --a2s:#2C1D16;
  --a3:#8FA0EE; --a3s:#1A1F33;
  --warn:#D9A63C; --warns:#2A2313;
  --danger:#E07070; --dangers:#2A1717;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--ink); min-height:100dvh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  overscroll-behavior-y:none;
}
button{font:inherit;cursor:pointer;touch-action:manipulation}
input,select{touch-action:manipulation}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.r{text-align:right} .c{text-align:center}
h1,h2,h3{margin:0}

/* Kopf */
.head{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 86%,transparent);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.head-top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 10px;gap:12px}
.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.weekbox{text-align:right;line-height:1.1}
.weeklbl{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.weeknum{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--a1)}
.weeksub{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.tabs{display:flex;padding:0 8px;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{-webkit-appearance:none;appearance:none;background:none;border:0;padding:9px 12px 10px;font-size:13px;color:var(--mut);
  border-bottom:2px solid transparent;white-space:nowrap;border-radius:10px 10px 0 0}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

main{padding:14px 12px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);padding:12px 14px;border-radius:16px;
  box-shadow:0 1px 0 rgba(255,255,255,.035) inset}
.h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;font-weight:700}
.p{margin:0 0 8px;font-size:13.5px}
.ol,.ul{margin:0 0 8px;padding-left:18px;font-size:13.5px}
.ol li,.ul li{margin-bottom:3px}
.no{list-style:none;padding-left:0}
.no li{padding-left:14px;position:relative}
.no li::before{content:"×";position:absolute;left:0;color:var(--a2);font-weight:700}

/* Sitzungsleiste */
.unitpick{display:flex;gap:6px;margin-bottom:12px}
.unitbtn{-webkit-appearance:none;appearance:none;flex:1;background:var(--sunk);border:1px solid var(--line);padding:8px 4px;text-align:center;
  border-top:3px solid var(--line);line-height:1.2;color:var(--ink);border-radius:10px}
.unitbtn .un{display:block;font-size:15px;font-weight:700}
.unitbtn .up{display:block;font-size:11px;color:var(--mut)}
.unitbtn.a1.on{border-top-color:var(--a1);background:var(--a1s)} .unitbtn.a1.on .un{color:var(--a1)}
.unitbtn.a2.on{border-top-color:var(--a2);background:var(--a2s)} .unitbtn.a2.on .un{color:var(--a2)}
.unitbtn.a3.on{border-top-color:var(--a3);background:var(--a3s)} .unitbtn.a3.on .un{color:var(--a3)}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.sessionmeta{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:12px;align-items:end}
.field{display:block;flex:1;min-width:0}
.sessionmeta .field{min-width:0;overflow:hidden}
.field>span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.field input,.field select{width:100%;max-width:100%;min-width:0;padding:8px;border:1px solid var(--line);background:var(--sunk);
  font:inherit;font-size:14px;color:var(--ink);border-radius:10px}
.field input[type=date]{min-width:0;max-width:100%}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
.field input[type=date]::-webkit-datetime-edit{min-width:0;padding:0}
.stufepick{display:flex;gap:4px}
.stufebtn{flex:1;padding:8px 0;border:1px solid var(--line);background:var(--sunk);font-weight:700;
  font-size:14px;color:var(--mut);border-radius:10px}
.stufebtn.sA.on{background:var(--a1s);border-color:var(--a1);color:var(--a1)}
.stufebtn.sB.on{background:var(--warns);border-color:var(--warn);color:var(--warn)}
.stufebtn.sC.on{background:var(--dangers);border-color:var(--danger);color:var(--danger)}
.stufetext{margin-top:8px;font-size:12px;color:var(--mut)}

.note{background:var(--a1s);border-left:3px solid var(--a1);padding:9px 12px;font-size:13px;border-radius:12px}
.note.b{background:var(--warns);border-left-color:var(--warn)}

/* Übungskarte */
.exlist{display:flex;flex-direction:column;gap:12px}
.ex{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:16px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.035) inset}
.ex.a1{border-left-color:var(--a1)} .ex.a2{border-left-color:var(--a2)} .ex.a3{border-left-color:var(--a3)}
.ex-head{display:flex;align-items:baseline;gap:8px;padding:11px 14px 0}
.ex-idx{font-size:11px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.ex-name{flex:1;font-size:15px;font-weight:700;line-height:1.25}
.ex-name i{font-style:normal;font-weight:400;color:var(--mut);font-size:12.5px}
.prio{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);
  border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.ex-target{display:flex;gap:14px;padding:4px 14px 8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.ex-target b{color:var(--ink)}
.warm{margin:0 14px 8px;padding:7px 9px;background:var(--sunk);font-size:12px;color:var(--mut);border-radius:12px}
.warm b{color:var(--ink);font-variant-numeric:tabular-nums}

.set{display:grid;grid-template-columns:18px 1fr 1fr 36px;align-items:end;gap:8px 10px;
  padding:8px 14px;border-top:1px solid var(--line2)}
.set.under{background:#1F1B13}
.set.hit{background:var(--a1s)}
.set-n{font-size:11px;color:var(--mut);font-weight:700;padding-bottom:8px}
.set-save{width:34px;min-height:34px;border:0;border-radius:10px;background:var(--a1);color:#0E1110;
  font-size:16px;font-weight:700;line-height:1;align-self:end;margin-bottom:1px;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
.set-save.done{background:var(--a1s);color:var(--a1);border:1px solid var(--a1)}
.set-save.empty{visibility:hidden;pointer-events:none;background:transparent;border:0}
.lbl{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.numf{min-width:0;width:auto}
.numrow{display:flex;border:1px solid var(--line);background:var(--sunk);border-radius:10px;overflow:hidden}
.numrow input{width:100%;min-width:0;border:0;text-align:center;font:inherit;font-size:16px;padding:6px 0;
  font-variant-numeric:tabular-nums;background:transparent;color:var(--ink);-moz-appearance:textfield}
.numrow input::-webkit-outer-spin-button,.numrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step{width:34px;min-height:34px;border:0;background:#232927;color:var(--ink);font-size:18px;line-height:1}

.prev{grid-column:1/-1;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--mut)}
.prev.none{justify-content:flex-start;font-style:italic;opacity:.75}
.prevval b{color:var(--warn);font-weight:700;font-size:14px}
.prevlbl{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-right:6px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:10.5px;font-variant-numeric:tabular-nums}
.chip.up{color:var(--a1);border-color:var(--a1)}
.chip.down{color:var(--warn);border-color:var(--warn)}
.chip.same{color:var(--mut)}

.ex-foot{display:flex;justify-content:space-between;gap:10px;padding:9px 14px 11px;
  border-top:1px solid var(--line2);font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.ready{color:var(--a1);font-weight:700;border:1px solid var(--a1);padding:1px 8px;border-radius:999px}
.lastval{color:var(--warn);font-weight:700;font-size:14px}

.btn{border:1px solid var(--line);background:var(--sunk);padding:12px 16px;font-size:15px;color:var(--ink);
  border-radius:12px;min-height:44px}
.btn.main{background:var(--a1);border-color:var(--a1);color:#0E1110;font-weight:700}
.btn.main:disabled{background:var(--line2);border-color:var(--line);color:var(--mut)}
.btn.danger{border-color:var(--danger);color:var(--danger)}

.chev{font-size:18px;color:var(--mut);width:18px;text-align:center}
.blk{margin-top:9px;padding:9px 11px;background:var(--sunk);border-left:2px solid var(--line);border-radius:12px}
.blk p{margin:0;font-size:13px}
.blk .ul{margin:0;padding-left:16px;font-size:12.5px}
.blk.warn{border-left-color:var(--warn);background:var(--warns)}
.blk.danger{border-left-color:var(--danger);background:var(--dangers)}
.blklbl{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.blk.warn .blklbl{color:var(--warn)}
.blk.danger .blklbl{color:var(--danger)}

/* Verlauf */
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1;min-width:78px;background:var(--panel);border:1px solid var(--line);padding:11px 12px;border-radius:14px}
.statnum{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.statlbl{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.chartwrap{margin:12px 0 4px;background:var(--sunk);border-radius:12px;padding:10px 8px}
.csv{width:100%;height:150px;margin-top:10px;font-family:ui-monospace,monospace;font-size:11px;
  border:1px solid var(--line);padding:8px;background:var(--sunk);color:var(--ink);border-radius:12px}

/* Tabellen */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
  font-weight:700;padding:0 6px 4px 0;border-bottom:1px solid var(--line)}
td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
th.c,td.c{text-align:center;padding-right:0}
td.r,th.r{text-align:right;padding-right:0}
tfoot td{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;
  border-top:1px solid var(--line);padding-top:7px}
td.k{width:74px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}

.empty h3{font-size:16px;margin-bottom:6px}
.toolshead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;color:var(--ink);min-height:44px}
.toolshead .chev{margin-left:auto}
.toolsbody{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.ghhead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;color:var(--ink)}
.ghstate{margin-left:auto;font-size:11px;color:var(--mut)}
.ghauto{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mut)}
.ghauto input{width:18px;height:18px;accent-color:var(--a1)}
.card.alarm{border-color:var(--danger);background:var(--dangers)}
.card.alarm .h3{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--a1);color:#0E1110;
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:50;opacity:0;
  transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}

/* iPhone 17 Pro 402×874 und benachbarte Phones */
@media (max-width:480px){
  body{font-size:16px}
  .head-top{padding:12px 16px 8px}
  .kicker{font-size:11px}
  .title{font-size:26px;letter-spacing:-.03em}
  .weeknum{font-size:28px}
  .tabs{padding:0 6px;gap:0}
  .tab{flex:1;padding:12px 6px 11px;font-size:13.5px;text-align:center;min-height:44px;border-radius:0}
  main{padding:12px 12px 8px;gap:14px}
  .card{padding:14px 14px;border-radius:18px}
  .unitpick{gap:6px;margin-bottom:12px}
  .unitbtn{padding:7px 4px;border-radius:12px;min-height:0}
  .unitbtn .un{font-size:14px}
  .unitbtn .up{font-size:11px}
  .row{gap:10px}
  .sessionmeta{grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px}
  .field>span{margin-bottom:4px}
  .field input,.field select{padding:7px 8px;font-size:16px;border-radius:10px;min-height:36px}
  .stufepick{gap:5px}
  .stufebtn{padding:7px 0;font-size:14px;border-radius:10px;min-height:36px}
  .stufetext{font-size:12px}
  .note{padding:11px 13px;font-size:14px;border-radius:14px}
  .ex{border-radius:18px}
  .ex-head{padding:14px 14px 0;align-items:center}
  .ex-name{font-size:17px}
  .ex-target{padding:6px 14px 10px;font-size:13px;gap:12px}
  .prio{font-size:10px;padding:3px 8px}
  .warm{margin:0 14px 10px;padding:9px 11px;font-size:13px;border-radius:12px}
  .set{grid-template-columns:16px 1fr 1fr 36px;gap:6px 7px;padding:9px 12px}
  .set-n{padding-bottom:9px}
  .numrow{border-radius:10px}
  .numrow input{font-size:16px;padding:6px 0}
  .step{width:34px;min-height:34px;font-size:18px}
  .prev{margin-top:4px;padding-top:8px;font-size:12px}
  .ex-foot{padding:11px 14px 13px;font-size:12px}
  .btn.main{width:100%;font-size:16px}
  .stats{gap:8px}
  .stat{min-width:calc(50% - 4px);padding:12px;border-radius:16px}
  .statnum{font-size:22px}
  table{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   DATEN
   ============================================================ */
var META = {
  klimmzug_o:{incr:2.5,step:1.25,bw:true,label:"Klimmzug Obergriff"},
  klimmzug_u:{incr:2.5,step:1.25,bw:true,label:"Klimmzug Untergriff"},
  dips:{incr:2.5,step:1.25,bw:true,label:"Dips vorgelehnt"},
  lh_rudern:{incr:2.5,step:2.5,label:"LH-Rudern vorgebeugt"},
  lh_bank:{incr:2.5,step:2.5,label:"LH-Bankdrücken flach"},
  lh_ohp:{incr:2,step:2.5,label:"LH-Überkopfdrücken"},
  lh_squat:{incr:5,step:2.5,label:"LH-Kniebeuge"},
  lh_rdl:{incr:5,step:2.5,label:"Rumänisches Kreuzheben"},
  lh_curl:{incr:2.5,step:2.5,label:"LH-Curl"},
  kh_bank:{incr:2,step:1,label:"KH-Bankdrücken flach"},
  kh_schraeg:{incr:2,step:1,label:"KH-Schrägbankdrücken 30°"},
  kh_rudern:{incr:2,step:1,label:"KH-Rudern einarmig"},
  kh_seit:{incr:1,step:1,label:"KH-Seitheben"},
  kh_tri:{incr:1,step:1,label:"KH-Trizepsstrecken"},
  bss:{incr:2,step:1,label:"Bulgarian Split Squat"},
  lunges:{incr:2,step:1,label:"Ausfallschritte rückwärts"},
  waden:{incr:2.5,step:2.5,label:"Stehendes Wadenheben"},
  clean_prep:{incr:2.5,step:2.5,label:"Clean Prep"},
  power_clean:{incr:2.5,step:2.5,label:"Power Clean"},
  back_squat:{incr:5,step:2.5,label:"Back Squat"},
  pullup:{incr:2.5,step:1.25,bw:true,label:"Pull up"},
  bench:{incr:2.5,step:2.5,label:"Bench Press"},
  landmine_row:{incr:2.5,step:2.5,label:"Landmine Row"},
  db_zpress:{incr:2,step:1,label:"DB Zpress"},
  oh_carry:{incr:2,step:1,label:"OH Carry"},
  hanging_tuck:{incr:0,step:1,bw:true,label:"Hanging Tuck up"},
  split_squat:{incr:2,step:1,label:"Split squat"},
  step_up:{incr:2,step:1,label:"Step up"},
  db_rdl:{incr:2,step:1,label:"DB RDL"},
  glute_bridge:{incr:2.5,step:2.5,label:"Glute Bridge"},
  copenhagen:{incr:0,step:1,bw:true,label:"Copenhagen Plank"}
};

var UNITS = [
 {id:"GK1",n:1,day:"Dienstag",prio:"Pull",accent:"a1",ex:[
  {id:"clean_prep",name:"Clean Prep",scheme:"3× 5+5+5",sets:3,min:5,max:5,rir:"2",pause:"1,5 Min",prio:true},
  {id:"power_clean",name:"Power Clean",scheme:"5×3",sets:5,min:3,max:3,rir:"2",pause:"1,5 Min",prio:true,warm:true},
  {id:"back_squat",name:"Back Squat",scheme:"3×5",sets:3,min:5,max:5,rir:"2",pause:"1,5 Min",prio:true,warm:true},
  {id:"pullup",name:"Pull up",scheme:"3×Max",sets:3,rir:"0",pause:"1,5 Min"}]},
 {id:"GK2",n:2,day:"Donnerstag",prio:"Push",accent:"a2",ex:[
  {id:"bench",name:"Bench Press",scheme:"3×6–8",sets:3,min:6,max:8,rir:"1–2",pause:"1,5 Min",prio:true,warm:true},
  {id:"landmine_row",name:"Landmine Row",scheme:"3×6–8",sets:3,min:6,max:8,rir:"1–2",pause:"1,5 Min",prio:true},
  {id:"db_zpress",name:"DB Zpress",scheme:"3×6–8",sets:3,min:6,max:8,rir:"2",pause:"1,5 Min",warm:true},
  {id:"oh_carry",name:"OH Carry",scheme:"3×20 m",sets:3,min:20,max:20,rir:"1",pause:"1,5 Min",repLabel:"m"},
  {id:"hanging_tuck",name:"Hanging Tuck up",scheme:"3×10",sets:3,min:10,max:10,rir:"0–1",pause:"1,5 Min"}]},
 {id:"GK3",n:3,day:"Samstag",prio:"Leg",accent:"a3",ex:[
  {id:"split_squat",name:"Split squat",hint:"/side",scheme:"3×6–8/side",sets:3,min:6,max:8,rir:"1–2",pause:"1,5 Min",prio:true,warm:true},
  {id:"step_up",name:"Step up",hint:"/side",scheme:"3×6–8/side",sets:3,min:6,max:8,rir:"1–2",pause:"1,5 Min"},
  {id:"db_rdl",name:"DB RDL",scheme:"3×8–12",sets:3,min:8,max:12,rir:"2",pause:"1,5 Min",prio:true,warm:true},
  {id:"glute_bridge",name:"Glute Bridge",scheme:"3×6–8",sets:3,min:6,max:8,rir:"1",pause:"1,5 Min"},
  {id:"copenhagen",name:"Copenhagen Plank",hint:"/side",scheme:"3×30 s",sets:3,min:30,max:30,rir:"0–1",pause:"1,5 Min",repLabel:"s"}]}
];

/* ============================================================
   SPEICHER — Artefakt-Speicher, sonst localStorage
   ============================================================ */
var KEY = "gk3:data";
var DRAFTKEY = "gk3:draft-v3";
var UNITKEY = "gk3:lastUnit";
var STORAGE_MODE = "unbekannt";

function writeLocal(key, obj){
  try { localStorage.setItem(key, JSON.stringify(obj)); return true; }
  catch(e){ return false; }
}
function readLocal(key){
  try { var v=localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
var store = {
  get: function(key){
    if (window.storage && window.storage.get) {
      return window.storage.get(key)
        .then(function(r){ return r && r.value ? JSON.parse(r.value) : null; })
        .catch(function(){ return readLocal(key); });
    }
    return Promise.resolve(readLocal(key));
  },
  set: function(key, obj){
    var localOk = writeLocal(key, obj);
    var s = JSON.stringify(obj);
    function lokal(){
      if(localOk) return Promise.resolve(true);
      try { localStorage.setItem(key, s); return Promise.resolve(true); }
      catch(e){
        var msg = (e && e.name==="QuotaExceededError")
          ? "Speicher voll — alte Einheiten exportieren und löschen"
          : "Browser erlaubt kein Speichern (privater Modus?)";
        return Promise.reject(new Error(msg));
      }
    }
    if (window.storage && window.storage.set) {
      return window.storage.set(key, s)
        .then(function(r){ if(r===null) throw new Error("leer"); return r; })
        .catch(function(){ return lokal(); });
    }
    return lokal();
  },
  del: function(key){
    if (window.storage && window.storage.delete) return window.storage.delete(key).catch(function(){});
    try { localStorage.removeItem(key); } catch(e){}
    return Promise.resolve(true);
  }
};

var STORAGE_OK = false;
var STORE_READY = false;

function initStorage(){
  var inApp = !!(window.storage && window.storage.get);
  var testKey = "gk3:test", stamp = String(Date.now());

  return store.set(testKey, stamp)
    .then(function(){ return store.get(testKey); })
    .then(function(back){
      STORAGE_OK = (back === stamp);
      return store.del(testKey);
    })
    .catch(function(){ STORAGE_OK = false; })
    .then(function(){
      if(!STORAGE_OK){ STORAGE_MODE = "wird nicht gespeichert"; return; }
      if(inApp){ STORAGE_MODE = "in deinem Claude-Konto"; return; }
      STORAGE_MODE = "in diesem Browser";
      if(navigator.storage && navigator.storage.persist){
        return navigator.storage.persist().then(function(ok){
          if(ok) STORAGE_MODE = "dauerhaft in diesem Browser";
        }).catch(function(){});
      }
    });
}

var GHKEY = "gk3:gh";
/* ==== Sync-Server (Cloudflare Worker) ============================
   Hier die Adresse deines Sync-Servers eintragen, z.B.:
     var SYNC_URL = "https://trainingslog.DEINNAME.workers.dev";
   Ist sie gesetzt, laeuft alles automatisch ueber den Server —
   auf keinem Geraet muss ein Token eingegeben werden.
   Bleibt sie leer, benutzt die App den direkten GitHub-Weg (mit Token).
   ================================================================= */
var SYNC_URL = "/api/data";
var GH = { token:"", owner:"Chris1576", repo:"Training", path:"Training.json", branch:"main", auto:true };
var GH_SHA = null;

function ghReady(){ return !!SYNC_URL || !!(GH.token && GH.owner && GH.repo && GH.path); }

function b64enc(str){
  var bytes = new TextEncoder().encode(str), bin = "";
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b64){
  var bin = atob(b64.replace(/\s/g,"")), bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghUrl(){
  return "https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/contents/"+
    GH.path.split("/").map(encodeURIComponent).join("/");
}
function ghHeaders(){
  return { "Authorization":"Bearer "+GH.token, "Accept":"application/vnd.github+json",
           "X-GitHub-Api-Version":"2022-11-28" };
}
function ghFehler(r){
  if(r.status===401) return "Token ungültig oder abgelaufen";
  if(r.status===403) return "Token hat keine Schreibrechte für dieses Repository";
  if(r.status===404) return "Repository oder Pfad nicht gefunden";
  if(r.status===409) return "Auf GitHub liegt ein neuerer Stand — erst laden, dann hochladen";
  return "Fehler "+r.status;
}

/* Holt die Datei; gibt null zurueck, wenn es sie noch nicht gibt */
function ghFetch(){
  if(SYNC_URL){
    return fetch(SYNC_URL+"?t="+Date.now(), {cache:"no-store", credentials:"same-origin"}).then(function(r){
      if(!r.ok) throw new Error("Sync-Server: Fehler "+r.status);
      return r.json();   /* Datenobjekt oder null */
    });
  }
  return fetch(ghUrl()+"?ref="+encodeURIComponent(GH.branch)+"&t="+Date.now(),
    {headers:ghHeaders(), cache:"no-store"}).then(function(r){
      if(r.status===404){ GH_SHA=null; return null; }
      if(!r.ok) throw new Error(ghFehler(r));
      return r.json().then(function(j){
        GH_SHA = j.sha;
        return JSON.parse(b64dec(j.content));
      });
    });
}

var _syncChain = Promise.resolve();
function runSync(task){
  var next = _syncChain.then(function(){ return task(); }, function(){ return task(); });
  _syncChain = next.then(function(){}, function(){});
  return next;
}

function ghPut(obj){
  if(SYNC_URL){
    return fetch(SYNC_URL, {method:"PUT", credentials:"same-origin", headers:{"Content-Type":"application/json"},
      body:JSON.stringify(obj)}).then(function(r){
        if(!r.ok) throw new Error("Sync-Server: Fehler "+r.status);
        return r.json().catch(function(){ return {ok:true}; });
      });
  }
  var body = { message:"Trainingslog "+today(), content:b64enc(JSON.stringify(obj,null,1)), branch:GH.branch };
  if(GH_SHA) body.sha = GH_SHA;
  return fetch(ghUrl(), {method:"PUT", headers:ghHeaders(), body:JSON.stringify(body)})
    .then(function(r){
      if(!r.ok) throw new Error(ghFehler(r));
      return r.json().then(function(j){ GH_SHA = j.content && j.content.sha; return true; });
    });
}

function setHasVal(s){
  return !!(s && ((s.kg!=="" && s.kg!=null) || (s.reps!=="" && s.reps!=null)));
}
function setStamp(s, sessionSavedAt){
  return Number(s && s.savedAt) || Number(sessionSavedAt) || 0;
}
function emptySetSlot(){ return { kg:"", reps:"", rir:"" }; }
function mergeSetArrays(a, b, savedA, savedB){
  var aa=a||[], bb=b||[], n=Math.max(aa.length, bb.length), out=[];
  for(var i=0;i<n;i++){
    var sa=aa[i], sb=bb[i];
    if(sa==null && sb==null){ out.push(emptySetSlot()); continue; }
    if(sa==null){ out.push(sb); continue; }
    if(sb==null){ out.push(sa); continue; }
    var fa=setHasVal(sa), fb=setHasVal(sb);
    if(fa && !fb){ out.push(sa); continue; }
    if(fb && !fa){ out.push(sb); continue; }
    out.push(setStamp(sa,savedA)>=setStamp(sb,savedB) ? sa : sb);
  }
  return out;
}
/* Gleicher Tag + gleiche Einheit = derselbe Eintrag. Pro Satzindex
   gewinnt der juengere savedAt — andere Saetze bleiben erhalten. */
function mergeSessions(a,b){
  var map={};
  (a||[]).concat(b||[]).forEach(function(s){
    var k = s.date+"|"+s.unit, alt = map[k];
    if(!alt){ map[k]=s; return; }
    var newer = (s.savedAt||0) >= (alt.savedAt||0) ? s : alt;
    var sets={}, keys={};
    Object.keys(s.sets||{}).forEach(function(ex){ keys[ex]=1; });
    Object.keys(alt.sets||{}).forEach(function(ex){ keys[ex]=1; });
    Object.keys(keys).forEach(function(ex){
      sets[ex]=mergeSetArrays((s.sets||{})[ex], (alt.sets||{})[ex], s.savedAt, alt.savedAt);
    });
    map[k]={ id:newer.id, date:newer.date, unit:newer.unit, week:newer.week,
             stufe:newer.stufe, sets:sets, savedAt:Math.max(s.savedAt||0, alt.savedAt||0) };
  });
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(x,y){ return x.date<y.date?-1:1; });
}

function dataStamp(d){
  return {
    startDate: d && d.startDate ? d.startDate : null,
    sessions: d && Array.isArray(d.sessions) ? d.sessions : [],
    updatedAt: Number(d && d.updatedAt) || 0,
    wipedAt: Number(d && d.wipedAt) || 0
  };
}
/* Gemeinsamer Stand: ein neueres Leeren gewinnt, sonst Einheiten zusammenfuehren. */
function reconcile(a, b){
  if(!b) return dataStamp(a);
  if(!a) return dataStamp(b);
  var A=dataStamp(a), B=dataStamp(b);
  if(B.wipedAt && B.wipedAt>=A.updatedAt && B.wipedAt>=A.wipedAt) return B;
  if(A.wipedAt && A.wipedAt>=B.updatedAt && A.wipedAt>=B.wipedAt) return A;
  return {
    startDate: (!A.startDate || (B.startDate && B.startDate<A.startDate)) ? (B.startDate||A.startDate) : A.startDate,
    sessions: mergeSessions(A.sessions, B.sessions),
    updatedAt: Math.max(A.updatedAt, B.updatedAt),
    wipedAt: Math.max(A.wipedAt, B.wipedAt)
  };
}

function ghStatus(text){
  var el=document.getElementById("ghStatus");
  if(el) el.textContent=text;
}

function syncUp(silent){
  if(!ghReady()) return Promise.resolve();
  ghStatus("Lade hoch …");
  return runSync(function(){
    return ghFetch()
      .then(function(remote){
        var merged = reconcile(S.data, remote);
        merged.updatedAt = Date.now();
        if(merged.wipedAt && !(merged.sessions && merged.sessions.length))
          merged.wipedAt = merged.updatedAt;
        S.data = merged;
        reapplyPending();
        return ghPut(S.data);
      })
      .then(function(result){
        if(result && result.data) S.data = reconcile(S.data, result.data);
        reapplyPending();
        GH.lastSync = new Date().toISOString();
        store.set(GHKEY, GH);
        return persist();
      })
      .then(function(){
        ghStatus("Hochgeladen " + timeShort(new Date()));
        if(S.tab==="training") patchTraining();
        else render();
        if(!silent) toast("Mit allen Geräten abgeglichen");
      });
  }).catch(function(e){
    ghStatus("Fehlgeschlagen: " + e.message);
    if(!silent) toast(e.message);
    throw e;
  });
}

function syncDown(silent){
  if(!ghReady()) return Promise.resolve();
  ghStatus("Lade herunter …");
  return runSync(function(){
    return ghFetch()
      .then(function(remote){
        if(!remote) {
          ghStatus("Noch kein gemeinsamer Stand");
          if(!silent) toast("Noch kein gemeinsamer Stand");
          return;
        }
        var vorher = S.data.sessions.length;
        S.data = reconcile(S.data, remote);
        GH.lastSync = new Date().toISOString();
        store.set(GHKEY, GH);
        reapplyPending();
        return persist().then(function(){
          var neu = S.data.sessions.length - vorher;
          ghStatus("Heruntergeladen " + timeShort(new Date()));
          var typing = S.tab==="training" && S.draft && draftHasValues(S.draft);
          var recent = Date.now() - _lastSaveAt < 20000;
          if(!typing && !recent) openLastUnit();
          if(S.tab==="training") patchTraining();
          else render();
          if(neu>0) toast(neu+" Einheiten dazugeladen");
          else if(!silent) toast("Stand ist bereits aktuell");
        });
      });
  }).catch(function(e){ ghStatus("Fehlgeschlagen: " + e.message); if(!silent) toast(e.message); });
}

function today(){ var d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function roundTo(v,s){ return Math.round(v/s)*s; }
function fmt(n){ if(n===""||n===null||n===undefined||isNaN(n)) return "–";
  return String(Math.round(n*100)/100).replace(".",","); }
function schemeText(ex){
  if(ex.scheme) return ex.scheme;
  if(ex.min!=null && ex.max!=null){
    if(ex.min===ex.max) return ex.sets+" × "+ex.min;
    return ex.sets+" × "+ex.min+"–"+ex.max;
  }
  return ex.sets+" Sätze";
}
function setUnit(ex){ return (ex && ex.repLabel) || "Wdh"; }
function exById(id){
  for(var i=0;i<UNITS.length;i++){
    for(var j=0;j<UNITS[i].ex.length;j++){
      if(UNITS[i].ex[j].id===id) return UNITS[i].ex[j];
    }
  }
  return null;
}
/* Einheitliche Darstellung: "10 Wdh × 10 kg" */
function lastSetText(x, ex){
  var reps = (x.reps===""||x.reps==null) ? "–" : esc(x.reps);
  var kg = (x.kg===""||x.kg==null||isNaN(Number(x.kg))) ? "–" : fmt(Number(x.kg));
  return reps+" "+setUnit(ex)+" × "+kg+" kg";
}
function lastDateAt(lp, i){
  if(!lp) return "";
  return (lp.dates && lp.dates[i]) || lp.date || "";
}
function lastLine(lp, ex){
  if(!lp) return "Noch kein Eintrag — Startgewicht in Woche 1 finden";
  var parts=[];
  for(var i=0;i<lp.sets.length;i++){
    if(setHasValue(lp.sets[i])) parts.push(lastSetText(lp.sets[i],ex));
  }
  if(!parts.length) return "Noch kein Eintrag — Startgewicht in Woche 1 finden";
  return "Zuletzt "+dateShort(lp.date)+" — "+parts.join(" · ");
}
function dateShort(d){ var p=d.split("-"); return p[2]+"."+p[1]+"."; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function weekOf(start,date){ if(!start) return 1;
  var a=new Date(start+"T00:00:00"), b=new Date(date+"T00:00:00");
  return Math.max(1, Math.floor(Math.floor((b-a)/86400000)/7)+1); }
function lastSavedSession(){
  if(typeof S==="undefined" || !S || !S.data) return null;
  var best=null;
  (S.data.sessions||[]).forEach(function(s){
    if(!best || (s.savedAt||0)>=(best.savedAt||0)) best=s;
  });
  return best;
}
function rememberUnit(id){
  if(!id || !unitById(id) || unitById(id).id!==id) return;
  try { localStorage.setItem(UNITKEY, id); } catch(e){}
  store.set(UNITKEY, id);
}
/* Zuletzt benutzte Einheit, nicht der Wochentag — der kann wandern. */
function suggestedUnit(){
  try {
    var v=localStorage.getItem(UNITKEY);
    if(v && unitById(v).id===v) return v;
  } catch(e){}
  var last=lastSavedSession();
  if(last && last.unit && unitById(last.unit).id===last.unit) return last.unit;
  return "GK1";
}
function openLastUnit(){
  if(S.draft && draftHasValues(S.draft)) return false;
  var last=lastSavedSession();
  var id= (last && last.unit) ? last.unit : suggestedUnit();
  if(!id || (S.draft && S.draft.unitId===id && S.draft.date===today())) return false;
  showUnit(id, S.draft?S.draft.stufe:"A", today());
  rememberUnit(id);
  return true;
}
function unitById(id){ for(var i=0;i<UNITS.length;i++) if(UNITS[i].id===id) return UNITS[i]; return UNITS[0]; }
function tonnage(sets){ var t=0; (sets||[]).forEach(function(x){ t+=(Number(x.kg)||0)*(Number(x.reps)||0); }); return t; }
function fmtTons(kg){
  if(!kg) return "0,00";
  return (kg/1000).toFixed(2).replace(".",",");
}
function weekTonnageForEx(sessions, exId){
  var map={};
  (sessions||[]).forEach(function(s){
    var t=tonnage(filledSets(s.sets && s.sets[exId]));
    if(!t) return;
    var w=s.week || weekOf(S.data.startDate, s.date);
    if(!map[w]) map[w]={week:w,ton:0,n:0};
    map[w].ton+=t;
    map[w].n++;
  });
  return Object.keys(map).map(Number).sort(function(a,b){ return a-b; }).map(function(w){ return map[w]; });
}

function progressionReady(sets,ex){
  if(ex.max==null) return false;
  var done=(sets||[]).filter(function(s){ return s.reps!=="" && s.kg!==""; });
  if(done.length<ex.sets) return false;
  return done.every(function(s){ return Number(s.reps)>=ex.max; });
}

function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("on"); },1800);
}

var S = {
  tab:"training",
  data:{ startDate:null, sessions:[] },
  draft:null,            /* {unitId,date,stufe,entries} */
  drafts:{},             /* "date|unit" -> draft */
  verlaufEx:"back_squat",
  showCsv:false,
  toolsOpen:false,
  autosavedAt:null,
  ghOpen:false
};

/* Ein Satz zaehlt, sobald der eigentliche Wert da ist: bei Eigengewicht
   und Halteuebungen reicht die Wiederholung / Sekunde, sonst kg + Wdh. */
function setHasValue(s){
  return !!(s && ((s.kg!=="" && s.kg!=null) || (s.reps!=="" && s.reps!=null)));
}
function setFilled(s, exId){
  if(!s) return false;
  var hasKg = s.kg!=="" && s.kg!=null;
  var hasReps = s.reps!=="" && s.reps!=null;
  var meta = META[exId] || {};
  var ex = exById(exId) || {};
  if(meta.bw || ex.repLabel==="s") return hasReps || hasKg;
  return hasKg && hasReps;
}

function lastByEx(){
  var m={};
  S.data.sessions.slice().sort(function(a,b){
    var sa=a.savedAt||0, sb=b.savedAt||0;
    if(sa!==sb) return sa-sb;
    var da=a.date||"", db=b.date||"";
    return da<db?-1:da>db?1:0;
  }).forEach(function(s){
    Object.keys(s.sets||{}).forEach(function(ex){
      var arr=s.sets[ex]||[];
      if(!m[ex]) m[ex]={date:s.date,sets:[],dates:[]};
      var any=false;
      for(var i=0;i<arr.length;i++){
        if(!setHasValue(arr[i])) continue;
        m[ex].sets[i]=arr[i];
        m[ex].dates[i]=s.date;
        any=true;
      }
      if(any) m[ex].date=s.date;
    });
  });
  return m;
}

function draftKey(date, unitId){ return (date||"")+"|"+(unitId||""); }
function parkDraft(){
  if(!S.draft) return;
  S.drafts[draftKey(S.draft.date, S.draft.unitId)] = S.draft;
}
function persistDrafts(){
  parkDraft();
  return store.set(DRAFTKEY, { bag:S.drafts, current:S.draft });
}

var _draftTimer=null;
function saveDraftSoon(){
  clearTimeout(_draftTimer);
  _draftTimer = setTimeout(function(){
    persistDrafts().then(function(){
      S.autosavedAt = new Date();
    }).catch(function(){});
  }, 350);
}
function timeShort(d){ return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
/* Zeigt einen gespeicherten ISO-Zeitstempel (UTC) in lokaler Zeit an */
function fmtSync(iso){ if(!iso) return ""; var d=new Date(iso);
  return dateShort(new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10))+" "+timeShort(d); }

/* Prueft, ob ein gespeicherter Entwurf noch zur aktuellen Planstruktur passt */
function draftValid(dr){
  if(!dr || !dr.unitId || !dr.entries) return false;
  var u=unitById(dr.unitId);
  if(!u || dr.unitId!==u.id) return false;
  for(var i=0;i<u.ex.length;i++){
    var arr=dr.entries[u.ex[i].id];
    if(!arr || !arr.length) return false;
  }
  return true;
}
function draftHasValues(dr){
  if(!dr || !dr.entries) return false;
  var keys=Object.keys(dr.entries);
  for(var i=0;i<keys.length;i++){
    var arr=dr.entries[keys[i]]||[];
    for(var j=0;j<arr.length;j++){
      if(setHasValue(arr[j])) return true;
    }
  }
  return false;
}

function sessionFor(date, unitId){
  var found=null;
  (S.data.sessions||[]).forEach(function(s){
    if(s.date===date && s.unit===unitId) found=s;
  });
  return found;
}
function filledSets(arr){
  return (arr||[]).filter(function(x){ return setHasValue(x); });
}
function cloneSetsMap(src){
  var sets={};
  Object.keys(src||{}).forEach(function(ex){
    var arr=Array.isArray(src[ex]) ? src[ex] : [];
    sets[ex]=arr.map(function(x){ return x ? { kg:x.kg, reps:x.reps, rir:x.rir||"", savedAt:x.savedAt } : { kg:"", reps:"", rir:"" }; });
  });
  return sets;
}
function emptyEntries(unitId){
  var u=unitById(unitId), entries={};
  u.ex.forEach(function(ex){
    var arr=[];
    for(var i=0;i<ex.sets;i++) arr.push({ kg:"", reps:"", rir:"" });
    entries[ex.id]=arr;
  });
  return entries;
}
function copySet(s){
  return { kg:s&&s.kg!=""&&s.kg!=null?String(s.kg):"", reps:s&&s.reps!=""&&s.reps!=null?String(s.reps):"", rir:(s&&s.rir)||"" };
}
function hydrateEntries(unitId, date, overlay){
  var entries=emptyEntries(unitId);
  var sess=sessionFor(date, unitId);
  if(overlay){
    Object.keys(overlay).forEach(function(ex){
      if(!entries[ex]) return;
      (overlay[ex]||[]).forEach(function(s,i){
        if(!entries[ex][i] || !setHasValue(s)) return;
        var saved=sess && sess.sets && sess.sets[ex] && sess.sets[ex][i];
        if(setMatchesSaved(s, saved)) return;
        entries[ex][i]=copySet(s);
      });
    });
  }
  return entries;
}
function savedSetAt(exId, i){
  var sess=S.draft ? sessionFor(S.draft.date, S.draft.unitId) : null;
  if(!sess || !sess.sets || !sess.sets[exId]) return null;
  return sess.sets[exId][i] || null;
}
function setMatchesSaved(s, saved){
  if(!saved || !setHasValue(s) || !setHasValue(saved)) return false;
  return String(s.kg||"")===String(saved.kg||"") && String(s.reps||"")===String(saved.reps||"");
}
function saveSetBtn(exId, i, s){
  if(!setFilled(s, exId)) return "<span class='set-save empty' aria-hidden='true'>✓</span>";
  return "<button class='set-save' data-saveset='"+exId+"|"+i+"' aria-label='Satz speichern'>✓</button>";
}
function effectiveSets(ex){
  var draft=(S.draft && S.draft.entries[ex.id])||[];
  var saved=((S.draft && sessionFor(S.draft.date, S.draft.unitId)||{}).sets||{})[ex.id]||[];
  var out=[];
  for(var i=0;i<ex.sets;i++){
    out.push(setFilled(draft[i], ex.id) ? draft[i] : (saved[i]||draft[i]||{kg:"",reps:"",rir:""}));
  }
  return out;
}
function clearDraftSet(exId, index){
  if(!S.draft || !S.draft.entries[exId] || !S.draft.entries[exId][index]) return;
  S.draft.entries[exId][index]={ kg:"", reps:"", rir:"" };
  var row=document.querySelector("[data-row='"+exId+"|"+index+"']");
  if(!row) return;
  var inputs=row.querySelectorAll("[data-in]");
  for(var i=0;i<inputs.length;i++) inputs[i].value="";
}

function buildDraft(unitId,stufe,date,overlay){
  S.draft={unitId:unitId,stufe:stufe||"A",date:date,entries:hydrateEntries(unitId, date, overlay||null)};
  parkDraft();
}
function showUnit(unitId, stufe, date){
  flushDraftFromDom();
  parkDraft();
  var k=draftKey(date, unitId);
  var parked=S.drafts[k];
  var overlay=parked && parked.entries ? parked.entries : null;
  buildDraft(unitId, (parked && parked.stufe) || stufe || "A", date, overlay);
}

function adoptDraftStore(raw){
  S.drafts={};
  if(!raw) return;
  if(raw.bag){
    S.drafts=raw.bag||{};
    if(raw.current && draftValid(raw.current)) S.draft=raw.current;
    return;
  }
  if(draftValid(raw)){
    S.drafts[draftKey(raw.date, raw.unitId)]=raw;
    S.draft=raw;
  }
}
</script>
<script>
/* ============================================================
   RENDERING
   ============================================================ */
var TABS=[["training","Training"],["verlauf","Verlauf"]];

function render(){
  var app=document.getElementById("app");
  app.innerHTML = headHTML() + "<main id='main'>" + bodyHTML() + "</main>";
}

function headHTML(){
  var w = S.data.startDate ? weekOf(S.data.startDate, today()) : "–";
  var tabs = TABS.map(function(t){
    return "<button class='tab"+(S.tab===t[0]?" on":"")+"' data-tab='"+t[0]+"'>"+t[1]+"</button>";
  }).join("");
  return "<header class='head'><div class='head-top'><div>"+
    "<div class='kicker'>Pull · Push · Leg</div>"+
    "<h1 class='title'>Trainingslog</h1></div>"+
    "<div class='weekbox'><span class='weeklbl'>Woche</span>"+
    "<span class='weeknum'>"+w+"</span>"+
    "<span class='weeksub'>"+S.data.sessions.length+" Einheiten</span></div></div>"+
    "<nav class='tabs'>"+tabs+"</nav></header>";
}

function storageBanner(){
  if(STORAGE_OK) return "";
  return "<div class='card alarm'><h3 class='h3'>Auf diesem Gerät wird nichts gespeichert</h3>"+
    "<p class='p'>Alles, was du hier einträgst, ist beim Schließen weg. Das passiert, wenn die Datei lokal geöffnet wurde oder der Browser im privaten Modus läuft.</p>"+
    "<p class='p mut'>Öffne die App stattdessen in der Claude-App — dann liegen deine Werte in deinem Konto und stehen auf jedem Gerät zur Verfügung.</p></div>";
}

function bodyHTML(){
  if(S.tab==="verlauf") return verlaufHTML();
  return storageBanner()+trainingHTML();
}

/* ---------- Training ---------- */
function unitPick(sel,action){
  return "<div class='unitpick'>"+UNITS.map(function(u){
    return "<button class='unitbtn "+u.accent+(sel===u.id?" on":"")+"' data-"+action+"='"+u.id+"'>"+
      "<span class='un'>Day "+u.n+"</span><span class='up'>"+u.prio+"</span></button>";
  }).join("")+"</div>";
}

function prevHTML(prev,prevDate,cur,ex){
  if(!prev) return "<div class='prev none'>Kein Vergleichswert — dieser Satz ist neu</div>";
  var pKg=Number(prev.kg), pReps=Number(prev.reps);
  var cKg = cur.kg===""?null:Number(cur.kg), cReps = cur.reps===""?null:Number(cur.reps);
  var unit=setUnit(ex), chips="";
  if(cReps!==null && !isNaN(pReps)){
    var r=cReps-pReps;
    chips += "<span class='chip "+(r>0?"up":r<0?"down":"same")+"'>"+
      (r===0?unit+" gleich":(r>0?"+":"−")+Math.abs(r)+" "+unit)+"</span>";
  }
  if(cKg!==null && !isNaN(pKg)){
    var d=Math.round((cKg-pKg)*100)/100;
    chips += "<span class='chip "+(d>0?"up":d<0?"down":"same")+"'>"+
      (d===0?"Gewicht gleich":(d>0?"+":"−")+fmt(Math.abs(d))+" kg")+"</span>";
  }
  return "<div class='prev'><span class='prevval'>"+
    "<span class='prevlbl'>"+(prevDate?dateShort(prevDate):"zuletzt")+"</span>"+
    "<b class='mono'>"+lastSetText(prev,ex)+"</b>"+
    "</span><span class='chips'>"+chips+"</span></div>";
}

function trainingHTML(){
  var d=S.draft, u=unitById(d.unitId), last=lastByEx();
  var week = weekOf(S.data.startDate, d.date);
  var kal = !S.data.startDate || week===1;

  var bar = "<div class='card'>"+unitPick(d.unitId,"unit")+
    "<label class='field'><span>Datum</span>"+
    "<input type='date' id='dateInput' value='"+d.date+"'></label></div>";

  var notes="";
  if(kal) notes += "<div class='note'><b>Woche 1 — Kalibrierung.</b> Einziges Ziel ist das Finden der Arbeitsgewichte, nicht die Auslastung.</div>";

  var cards = u.ex.map(function(ex,idx){
    var meta=META[ex.id]||{}, sets=d.entries[ex.id]||[], lp=last[ex.id];
    var warmBase = Number(sets[0]&&sets[0].kg) || (lp&&lp.sets[0]?Number(lp.sets[0].kg):0);
    var warm="";
    if(ex.warm && !meta.bw){
      warm = "<div class='warm'>Aufwärmen "+(warmBase>0
        ? "<b>"+fmt(roundTo(warmBase*0.5,meta.step))+" kg</b> × 5 &nbsp;→&nbsp; <b>"+fmt(roundTo(warmBase*0.78,meta.step))+" kg</b> × 3"
        : "50 % × 5 → 78 % × 3, sobald ein Arbeitsgewicht steht")+"</div>";
    }
    var rows = sets.map(function(s,i){
      var hit = setHasValue(s);
      var und = ex.min!=null && s.reps!=="" && Number(s.reps)<ex.min;
      return "<div class='set"+(hit?" hit":"")+(und?" under":"")+"' data-row='"+ex.id+"|"+i+"'>"+
        "<span class='set-n'>"+(i+1)+"</span>"+
        numField(setUnit(ex),s.reps,1,ex.id,i,"reps")+
        numField("kg",s.kg,meta.step||2.5,ex.id,i,"kg")+
        saveSetBtn(ex.id,i,s)+
        prevHTML(lp&&lp.sets[i], lastDateAt(lp,i), s, ex)+
        "</div>";
    }).join("");
    var ready = !kal && progressionReady(effectiveSets(ex),ex);
    return "<section class='ex "+u.accent+"' data-card='"+ex.id+"'>"+
      "<div class='ex-head'><span class='ex-idx'>"+(idx+1)+"</span>"+
      "<div class='ex-name'>"+esc(ex.name)+(ex.hint?" <i>"+esc(ex.hint)+"</i>":"")+"</div>"+
      (ex.prio?"<span class='prio'>Priorität</span>":"")+"</div>"+
      "<div class='ex-target'><span><b>"+esc(schemeText(ex))+"</b></span>"+
      "<span>Pause "+ex.pause+"</span></div>"+
      warm+"<div class='sets'>"+rows+"</div>"+
      "<div class='ex-foot'><span class='last'>"+
      lastLine(lp,ex)+
      "</span><span class='readyslot'>"+
      (ready&&meta.incr?"<span class='ready'>Nächstes Mal +"+fmt(meta.incr)+" kg"+(meta.bw?" Zusatz":"")+"</span>":"")+
      "</span></div></section>";
  }).join("");

  return bar+notes+"<div class='exlist'>"+cards+"</div>";
}

function numField(label,value,step,exId,i,field){
  return "<div class='numf'><span class='lbl'>"+label+"</span><div class='numrow'>"+
    "<button class='step' data-bump='"+exId+"|"+i+"|"+field+"|-1|"+step+"' aria-label='"+label+" verringern'>−</button>"+
    "<input type='text' inputmode='decimal' enterkeyhint='done' autocomplete='off' value='"+esc(value)+"' placeholder='–' data-in='"+exId+"|"+i+"|"+field+"'>"+
    "<button class='step' data-bump='"+exId+"|"+i+"|"+field+"|1|"+step+"' aria-label='"+label+" erhöhen'>+</button>"+
    "</div></div>";
}

/* Gezielte Aktualisierung ohne Neuaufbau (Fokus bleibt im Feld) */
function patchTraining(){
  var d=S.draft, u=unitById(d.unitId), last=lastByEx();
  var kal = !S.data.startDate || weekOf(S.data.startDate,d.date)===1;
  u.ex.forEach(function(ex){
    var sets=d.entries[ex.id]||[], lp=last[ex.id], meta=META[ex.id]||{};
    sets.forEach(function(s,i){
      var row=document.querySelector("[data-row='"+ex.id+"|"+i+"']");
      if(!row) return;
      var hit = setHasValue(s);
      var und = ex.min!=null && s.reps!=="" && Number(s.reps)<ex.min;
      row.classList.toggle("hit",hit); row.classList.toggle("under",und);
      var pv=row.querySelector(".prev");
      if(pv) pv.outerHTML = prevHTML(lp&&lp.sets[i], lastDateAt(lp,i), s, ex);
      var btn=row.querySelector(".set-save");
      if(btn) btn.outerHTML = saveSetBtn(ex.id,i,s);
    });
    var card=document.querySelector("[data-card='"+ex.id+"']");
    if(card){
      var lastEl=card.querySelector(".ex-foot .last");
      if(lastEl) lastEl.innerHTML = lastLine(lp, ex);
      var slot=card.querySelector(".readyslot");
      var ready = !kal && progressionReady(effectiveSets(ex),ex);
      if(slot) slot.innerHTML = ready&&meta.incr
        ? "<span class='ready'>Nächstes Mal +"+fmt(meta.incr)+" kg"+(meta.bw?" Zusatz":"")+"</span>" : "";
      var w=card.querySelector(".warm");
      if(w && ex.warm && !meta.bw){
        var base=Number(sets[0]&&sets[0].kg)||(lp&&lp.sets[0]?Number(lp.sets[0].kg):0);
        w.innerHTML = "Aufwärmen "+(base>0
          ? "<b>"+fmt(roundTo(base*0.5,meta.step))+" kg</b> × 5 &nbsp;→&nbsp; <b>"+fmt(roundTo(base*0.78,meta.step))+" kg</b> × 3"
          : "50 % × 5 → 78 % × 3, sobald ein Arbeitsgewicht steht");
      }
    }
  });
}

/* ---------- Verlauf ---------- */
function allExIds(){
  var seen={}, out=[];
  UNITS.forEach(function(u){ u.ex.forEach(function(e){ if(!seen[e.id]){ seen[e.id]=1; out.push(e.id); } }); });
  return out;
}

function sparkline(series){
  if(series.length<2) return "<p class='p mut'>Ab der zweiten Einheit erscheint hier die Kurve.</p>";
  var W=300,H=110,pad=6;
  var vals=series.map(function(p){ return p.kg; });
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mx===mn){ mx=mn+1; mn=mn-1; }
  var pts=series.map(function(p,i){
    var x=pad+i*(W-2*pad)/(series.length-1);
    var y=H-pad-(p.kg-mn)/(mx-mn)*(H-2*pad);
    return [x,y];
  });
  var line=pts.map(function(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
  var dots=pts.map(function(p){ return "<circle cx='"+p[0].toFixed(1)+"' cy='"+p[1].toFixed(1)+"' r='3' fill='#4FC8B4'/>"; }).join("");
  var grid=[0,0.5,1].map(function(f){ var y=pad+f*(H-2*pad);
    return "<line x1='"+pad+"' y1='"+y+"' x2='"+(W-pad)+"' y2='"+y+"' stroke='#2B322E' stroke-dasharray='2 4'/>"; }).join("");
  return "<div class='chartwrap'><svg viewBox='0 0 "+W+" "+H+"' width='100%' height='150' preserveAspectRatio='none'>"+
    grid+"<polyline points='"+line+"' fill='none' stroke='#4FC8B4' stroke-width='2'/>"+dots+"</svg>"+
    "<div class='row' style='justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px'>"+
    "<span>"+series[0].datum+" · "+fmt(series[0].kg)+" kg</span>"+
    "<span>"+series[series.length-1].datum+" · "+fmt(series[series.length-1].kg)+" kg</span></div></div>";
}

function verlaufHTML(){
  var sessions=S.data.sessions.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  if(!sessions.length){
    return "<div class='card empty'><h3>Noch keine Einheit erfasst</h3>"+
      "<p class='p mut'>Trage im Tab <b>Training</b> die erste Einheit ein. Danach erscheinen hier die Gewichtsverläufe je Übung, die Tonnage pro Einheit und der Hinweis, wenn eine Übung drei Einheiten lang stagniert.</p>"+
      "<p class='p mut'>Wer den Link und die Anmeldung hat, sieht denselben Verlauf — nach dem Speichern einer Einheit.</p></div>"+
      toolsHTML(
      "<div class='card'><h3 class='h3'>Sicherung</h3>"+
      "<p class='p mut'>Eine gespeicherte Sicherungsdatei lässt sich hier einlesen.</p>"+
      "<div class='row' style='gap:8px'>"+
      "<label class='btn' for='importFile'>Sicherung laden</label>"+
      "<input type='file' id='importFile' accept='.json,application/json' style='display:none'>"+
      "</div></div>"+
      ghCardHTML());
  }
  var exId=S.verlaufEx;
  var series=[];
  sessions.forEach(function(s){
    var sets=filledSets(s.sets && s.sets[exId]);
    if(!sets.length) return;
    var top=Math.max.apply(null,sets.map(function(x){ return Number(x.kg)||0; }));
    series.push({datum:dateShort(s.date),date:s.date,kg:top,ton:Math.round(tonnage(sets)),sets:sets,week:s.week});
  });
  var totalTon=0;
  sessions.forEach(function(s){ Object.keys(s.sets).forEach(function(k){ totalTon+=tonnage(s.sets[k]); }); });
  var lastS=sessions[sessions.length-1];

  var stalled=false;
  if(series.length>=3){
    var l3=series.slice(-3).map(function(p){ return p.kg; });
    stalled = l3[0]===l3[1] && l3[1]===l3[2];
  }

  var stats="<div class='stats'>"+
    stat(sessions.length,"Einheiten")+
    stat(weekOf(S.data.startDate,today()),"aktuelle Woche")+
    stat((totalTon/1000).toFixed(1).replace(".",","),"Tonnen gesamt")+
    stat(dateShort(lastS.date),"letzte Einheit")+"</div>";

  var opts=allExIds().map(function(id){
    return "<option value='"+id+"'"+(id===exId?" selected":"")+">"+esc((META[id]||{}).label||id)+"</option>";
  }).join("");

  var body;
  if(series.length){
    var rows=series.slice().reverse().map(function(p,ri){
      var setsHtml = filledSets(p.sets).map(function(x){ return lastSetText(x, exById(exId)); }).join(" · ");
      if(ri===0) setsHtml = "<span class='lastval'>"+setsHtml+"</span>";
      return "<tr><td>"+p.datum+"</td><td class='mut'>"+(p.week||"–")+"</td><td class='mono'>"+
        setsHtml+
        "</td><td class='r mono'>"+p.ton+"</td></tr>";
    }).join("");
    var curWeek=weekOf(S.data.startDate,today());
    var weeks=weekTonnageForEx(sessions, exId);
    var weekRows=weeks.slice().reverse().map(function(w){
      var now=w.week===curWeek;
      return "<tr><td>"+(now?"<span class='lastval'>Woche "+w.week+"</span>":"Woche "+w.week)+"</td>"+
        "<td class='mut'>"+w.n+(w.n===1?" Einheit":" Einheiten")+"</td>"+
        "<td class='r mut'>"+Math.round(w.ton)+" kg</td>"+
        "<td class='r mono"+(now?" lastval":"")+"'>"+fmtTons(w.ton)+" t</td></tr>";
    }).join("");
    var weekSum=weeks.reduce(function(s,w){ return s+w.ton; },0);
    var weekBlock=weeks.length
      ? "<h3 class='h3' style='margin:16px 0 8px'>Tonnen pro Woche</h3>"+
        "<p class='p mut'>Summe dieser Übung je Trainingswoche — alle Sätze zusammen.</p>"+
        "<table><thead><tr><th>Woche</th><th>Einheiten</th><th class='r'>kg</th><th class='r'>Tonnen</th></tr></thead><tbody>"+
        weekRows+"</tbody><tfoot><tr><td colspan='3'>Gesamt diese Übung</td><td class='r mono'>"+fmtTons(weekSum)+" t</td></tr></tfoot></table>"
      : "";
    body = sparkline(series)+
      (stalled?"<div class='note b'><b>Keine Steigerung über drei Einheiten.</b> Kandidat für Deload oder Technikanalyse — nicht für zusätzliches Volumen.</div>":"")+
      "<table><thead><tr><th>Datum</th><th>Wo.</th><th>Sätze</th><th class='r'>Tonnage</th></tr></thead><tbody>"+rows+"</tbody></table>"+
      weekBlock;
  } else {
    body = "<p class='p mut'>Für diese Übung ist noch nichts erfasst.</p>";
  }

  var csv="";
  if(S.showCsv){
    var lines=["Datum;Woche;Einheit;Stufe;Uebung;Satz;Wdh;kg;RIR"];
    sessions.forEach(function(s){
      Object.keys(s.sets).forEach(function(ex){
        (s.sets[ex]||[]).forEach(function(x,i){
          if(!setHasValue(x)) return;
          lines.push([s.date,s.week,s.unit,s.stufe||"A",(META[ex]||{}).label||ex,i+1,x.reps,x.kg,x.rir].join(";"));
        });
      });
    });
    csv="<textarea class='csv' readonly>"+esc(lines.join("\n"))+"</textarea>";
  }

  return stats+
    "<div class='card'><label class='field'><span>Übung</span><select id='exSelect'>"+opts+"</select></label>"+body+"</div>"+
    toolsHTML(
    "<div class='card'><div class='row' style='gap:8px'>"+
    "<button class='btn' id='csvBtn'>"+(S.showCsv?"CSV ausblenden":"Daten als CSV anzeigen")+"</button>"+
    "<button class='btn' id='exportBtn'>CSV herunterladen</button></div>"+csv+"</div>"+
    "<div class='card'><h3 class='h3'>Sicherung</h3>"+
    "<p class='p mut'>Gespeicherte Einheiten liegen auf dem gemeinsamen Server. Jeder mit Link und Anmeldung sieht denselben Verlauf. Lokal zusätzlich: "+STORAGE_MODE+".</p>"+
    "<div class='row' style='gap:8px'>"+
    "<button class='btn' id='backupBtn'>Sicherung speichern</button>"+
    "<label class='btn' for='importFile'>Sicherung laden</label>"+
    "<input type='file' id='importFile' accept='.json,application/json' style='display:none'>"+
    "<button class='btn danger' id='clearBtn'>Alle Daten löschen</button></div></div>"+
    ghCardHTML());
}
function toolsHTML(inner){
  var open=S.toolsOpen;
  return "<div class='card'>"+
    "<button class='toolshead' id='toolsToggle'>"+
    "<span class='h3' style='margin:0'>Daten &amp; Sicherung</span>"+
    "<span class='chev'>"+(open?"▴":"▾")+"</span></button></div>"+
    (open?inner:"");
}
function stat(n,l){ return "<div class='stat'><span class='statnum'>"+n+"</span><span class='statlbl'>"+l+"</span></div>"; }

function ghCardHTML(){
  var offen = S.ghOpen;
  var titel = SYNC_URL ? "Automatischer Abgleich" : "Abgleich mit GitHub";
  var kopf = "<div class='card'><button class='ghhead' id='ghToggle'>"+
    "<span class='h3' style='margin:0'>"+titel+"</span>"+
    "<span class='ghstate'>"+(ghReady()?(SYNC_URL?"aktiv":"eingerichtet"):"nicht eingerichtet")+"</span>"+
    "<span class='chev'>"+(offen?"−":"+")+"</span></button>";
  if(!offen) return kopf+"</div>";

  if(SYNC_URL){
    return kopf+
      "<p class='p mut' style='margin-top:10px'>Gespeicherte Einheiten gelten für alle, die diesen Link und die Anmeldung nutzen — zum Beispiel du und dein Trainer. Nach dem Speichern gehen sie auf den Server, beim Öffnen kommt der gemeinsame Stand zurück. Du musst hier <b>nichts</b> eintragen.</p>"+
      "<div class='row' style='gap:8px;margin-top:10px'>"+
      "<button class='btn' id='ghUp'>Jetzt hochladen</button>"+
      "<button class='btn' id='ghDown'>Jetzt herunterladen</button>"+
      "<button class='btn' id='ghForce'>GitHub-Stand übernehmen</button></div>"+
      "<p class='p mut' id='ghStatus' style='margin:9px 0 0'>Bereit.</p></div>";
  }

  return kopf+
    "<p class='p mut' style='margin-top:10px'>Legt deinen Verlauf als JSON-Datei im Repository ab, damit Handy und Rechner denselben Stand haben. Der Abgleich läuft automatisch: nach jedem Speichern hoch, beim Öffnen und Zurückkehren zur App wieder herunter. Du musst nur einmal pro Gerät das Token eintragen.</p>"+
    "<div class='row'>"+
    "<label class='field'><span>Token</span><input type='password' id='ghToken' value='"+esc(GH.token)+"' placeholder='github_pat_…' autocomplete='off'></label>"+
    "</div><div class='row'>"+
    "<label class='field'><span>Konto</span><input type='text' id='ghOwner' value='"+esc(GH.owner)+"' placeholder='Chris1576' autocomplete='off'></label>"+
    "<label class='field'><span>Repository</span><input type='text' id='ghRepo' value='"+esc(GH.repo)+"' placeholder='trainingsdaten' autocomplete='off'></label>"+
    "</div><div class='row'>"+
    "<label class='field'><span>Dateiname</span><input type='text' id='ghPath' value='"+esc(GH.path)+"' autocomplete='off'></label>"+
    "<label class='field'><span>Branch</span><input type='text' id='ghBranch' value='"+esc(GH.branch)+"' autocomplete='off'></label>"+
    "</div>"+
    "<label class='ghauto'><input type='checkbox' id='ghAuto'"+(GH.auto?" checked":"")+"> Automatisch abgleichen (nach dem Speichern hoch, beim Öffnen herunter)</label>"+
    "<div class='row' style='gap:8px;margin-top:10px'>"+
    "<button class='btn' id='ghSave'>Zugang speichern</button>"+
    "<button class='btn' id='ghUp'>Jetzt hochladen</button>"+
    "<button class='btn' id='ghDown'>Von GitHub laden</button>"+
    "<button class='btn' id='ghForce'>GitHub-Stand übernehmen</button></div>"+
    "<p class='p mut' id='ghStatus' style='margin:9px 0 0'>"+
    (ghReady()
      ? "Ziel: "+esc(GH.owner)+"/"+esc(GH.repo)+"/"+esc(GH.path)+" · "+
        (GH.lastSync ? "zuletzt abgeglichen "+fmtSync(GH.lastSync) : "noch kein Abgleich")
      : "Es fehlt noch: "+
        [(!GH.token?"Token":""),(!GH.owner?"Konto":""),(!GH.repo?"Repository":"")].filter(Boolean).join(", "))+"</p>"+
    "<div class='blk'><span class='blklbl'>Token erzeugen</span><p>GitHub → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b>. Unter „Repository access“ nur das eine Datenrepository auswählen, unter „Permissions“ bei <b>Contents</b> auf <b>Read and write</b> stellen. Das Token bleibt nur auf diesem Gerät und steht nicht in der App-Datei.</p></div></div>";
}

<script>
/* ============================================================
   INTERAKTION
   ============================================================ */
var _persistChain = Promise.resolve();
function snapshotData(){
  try { return JSON.parse(JSON.stringify(S.data)); }
  catch(e){ return S.data; }
}
function persist(){
  if(!STORE_READY) return Promise.resolve();
  var immediate = snapshotData();
  writeLocal(KEY, immediate);
  _persistChain = _persistChain.then(function(){
    return store.set(KEY, snapshotData());
  }, function(){
    return store.set(KEY, snapshotData());
  }).catch(function(e){
    toast("Nicht gespeichert: " + (e && e.message ? e.message : "unbekannter Fehler"));
    throw e;
  });
  return _persistChain;
}
function persistAllNow(){
  if(!STORE_READY) return;
  if(S.draft) flushDraftFromDom();
  parkDraft();
  clearTimeout(_draftTimer);
  writeLocal(KEY, snapshotData());
  writeLocal(DRAFTKEY, { bag:S.drafts, current:S.draft });
  persist();
  persistDrafts();
}

function normalizeNum(v){
  if(v==null) return "";
  var s=String(v).trim().replace(/\s/g,"").replace(",", ".");
  if(s==="" || s==="-" || s==="." ) return "";
  var n=Number(s);
  return isNaN(n) ? "" : String(n);
}
function firstFilled(){
  for(var i=0;i<arguments.length;i++){
    if(arguments[i]!=="" && arguments[i]!=null) return arguments[i];
  }
  return "";
}
function readSetFromRow(exId, index){
  var out={kg:"",reps:"",rir:""};
  var row=document.querySelector("[data-row='"+exId+"|"+index+"']");
  if(!row) return out;
  var nodes=row.querySelectorAll("[data-in]");
  for(var i=0;i<nodes.length;i++){
    var raw=nodes[i].getAttribute("data-in");
    if(!raw) continue;
    out[raw.split("|")[2]] = nodes[i].value;
  }
  return out;
}
function mergeSetVals(a,b,c){
  a=a||{}; b=b||{}; c=c||{};
  return {
    kg: firstFilled(a.kg, b.kg, c.kg),
    reps: firstFilled(a.reps, b.reps, c.reps),
    rir: firstFilled(a.rir, b.rir, c.rir) || ""
  };
}
function ensureDraftSlot(exId, index){
  if(!S.draft) return null;
  if(!S.draft.entries[exId]) S.draft.entries[exId]=[];
  while(S.draft.entries[exId].length<=index)
    S.draft.entries[exId].push({kg:"",reps:"",rir:""});
  return S.draft.entries[exId][index];
}
function writeSetIntoSession(date, unitId, stufe, exId, index, written){
  if(!S.data.sessions) S.data.sessions=[];
  var week=weekOf(S.data.startDate, date);
  var existing=sessionFor(date, unitId);
  var sets=cloneSetsMap(existing && existing.sets);
  if(!sets[exId]) sets[exId]=[];
  var need=Math.max(index+1, (exById(exId)||{}).sets||0);
  while(sets[exId].length<need) sets[exId].push({kg:"",reps:"",rir:""});
  sets[exId][index]=written;
  S.data.sessions=S.data.sessions.filter(function(sess){ return !(sess.date===date && sess.unit===unitId); });
  S.data.sessions.push({id:date+"-"+unitId,date:date,unit:unitId,week:week,stufe:stufe||"A",
    sets:sets,savedAt:written.savedAt||Date.now()});
  S.data.sessions=mergeSessions(S.data.sessions, S.data.sessions);
  S.data.updatedAt=written.savedAt||Date.now();
}
var _lastSaveAt=0;
var _pendingSaved=[];
var _saveLock={};
function rememberPending(date, unitId, exId, index, set){
  _pendingSaved.push({date:date,unit:unitId,ex:exId,index:index,set:set,until:Date.now()+120000});
}
function reapplyPending(){
  var now=Date.now();
  _pendingSaved=_pendingSaved.filter(function(p){ return p.until>now; });
  _pendingSaved.forEach(function(p){
    var sess=sessionFor(p.date, p.unit);
    var got=sess && sess.sets && sess.sets[p.ex] && sess.sets[p.ex][p.index];
    if(setMatchesSaved(p.set, got)) return;
    writeSetIntoSession(p.date, p.unit, (sess&&sess.stufe)||(S.draft&&S.draft.stufe)||"A", p.ex, p.index, p.set);
  });
}

function flushDraftFromDom(){
  if(!S.draft || !S.draft.entries) return;
  var nodes = document.querySelectorAll("[data-in]");
  for(var i=0;i<nodes.length;i++){
    var t=nodes[i], raw=t.getAttribute("data-in");
    if(!raw) continue;
    var p=raw.split("|"), ex=p[0], idx=Number(p[1]), field=p[2];
    var slot=ensureDraftSlot(ex, idx);
    if(!slot) continue;
    var next=t.value, cur=slot[field];
    /* Fokusverlust darf einen schon eingegebenen Wert nicht leeren. */
    if((next==="" || next==null) && cur!=="" && cur!=null) continue;
    slot[field] = next;
  }
}

function saveSet(exId, index, silent){
  var lock=exId+"|"+index;
  if(_saveLock[lock]) return;
  _saveLock[lock]=true;
  setTimeout(function(){ delete _saveLock[lock]; }, 700);
  var d=S.draft;
  if(!d){ if(!silent) toast("Satz unvollständig"); return; }
  var slot=ensureDraftSlot(exId, index);
  var before=slot ? { kg:slot.kg, reps:slot.reps, rir:slot.rir||"" } : { kg:"", reps:"", rir:"" };
  var fromDom=readSetFromRow(exId, index);
  flushDraftFromDom();
  var s=mergeSetVals(d.entries[exId][index], fromDom, before);
  s.kg=normalizeNum(s.kg);
  s.reps=normalizeNum(s.reps);
  d.entries[exId][index]=s;
  if(!setFilled(s, exId)){ if(!silent) toast("Satz unvollständig"); return; }
  var now=Date.now();
  if(!S.data.startDate) S.data.startDate=d.date;
  var written={ kg:s.kg, reps:s.reps, rir:s.rir||"", savedAt:now };
  writeSetIntoSession(d.date, d.unitId, d.stufe, exId, index, written);
  rememberPending(d.date, d.unitId, exId, index, written);
  _lastSaveAt=now;
  rememberUnit(d.unitId);
  clearDraftSet(exId, index);
  persistAllNow();
  patchTraining();
  if(!silent) toast("Satz gespeichert");
  persist().then(function(){
    reapplyPending();
    patchTraining();
    if(!ghReady()) return;
    return syncUp(true).then(function(){
      reapplyPending();
      persist();
      patchTraining();
    }).catch(function(){});
  }).catch(function(e){
    if(!silent) toast("Nicht gespeichert: " + (e && e.message ? e.message : "unbekannter Fehler"));
  });
}

function downloadCsv(){
  var lines=["Datum;Woche;Einheit;Stufe;Uebung;Satz;Wdh;kg;RIR"];
  S.data.sessions.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(s){
    Object.keys(s.sets).forEach(function(ex){
      (s.sets[ex]||[]).forEach(function(x,i){
        if(!setHasValue(x)) return;
        lines.push([s.date,s.week,s.unit,s.stufe||"A",(META[ex]||{}).label||ex,i+1,x.reps,x.kg,x.rir].join(";"));
      });
    });
  });
  try{
    var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="Trainingslog.csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  }catch(e){
    S.showCsv=true; render(); toast("Download nicht möglich — CSV wird angezeigt");
  }
}

document.addEventListener("pointerdown",function(ev){
  var el=ev.target.closest && ev.target.closest("[data-saveset]");
  if(!el) return;
  ev.preventDefault();
  var v=el.getAttribute("data-saveset");
  if(!v) return;
  var sp=v.split("|");
  saveSet(sp[0], Number(sp[1]));
}, true);

document.addEventListener("click",function(ev){
  var el=ev.target.closest ? ev.target.closest("[data-tab],[data-unit],[data-saveset],[data-bump],#toolsToggle,#csvBtn,#clearBtn,#exportBtn,#backupBtn,#ghToggle,#ghSave,#ghUp,#ghDown,#ghForce") : null;
  if(!el) return;

  var v;
  if((v=el.getAttribute("data-tab"))){ S.tab=v; render(); window.scrollTo(0,0); return; }

  if((v=el.getAttribute("data-unit"))){
    if(v!==S.draft.unitId){ showUnit(v,S.draft.stufe,S.draft.date); rememberUnit(v); saveDraftSoon(); render(); }
    return;
  }
  if((v=el.getAttribute("data-saveset"))){
    var sp=v.split("|");
    saveSet(sp[0], Number(sp[1]));
    return;
  }

  if((v=el.getAttribute("data-bump"))){
    var q=v.split("|"), ex=q[0], i=Number(q[1]), field=q[2], dir=Number(q[3]), step=Number(q[4]);
    var st=S.draft.entries[ex][i];
    var cur = st[field]==="" ? 0 : Number(st[field]);
    var next = Math.max(0, Math.round((cur+dir*step)*100)/100);
    st[field]=String(next);
    var input=document.querySelector("[data-in='"+ex+"|"+i+"|"+field+"']");
    if(input) input.value=next;
    patchTraining(); saveDraftSoon(); return;
  }

  if(el.id==="toolsToggle"){ S.toolsOpen=!S.toolsOpen; render(); return; }
  if(el.id==="csvBtn"){ S.showCsv=!S.showCsv; render(); return; }
  if(el.id==="exportBtn"){ downloadCsv(); return; }
  if(el.id==="backupBtn"){ downloadBackup(); return; }
  if(el.id==="ghToggle"){ S.ghOpen=!S.ghOpen; render(); return; }
  if(el.id==="ghSave"){
    function feld(id){ var e=document.getElementById(id); return e ? String(e.value||"").trim() : ""; }
    GH.token  = feld("ghToken");
    GH.owner  = feld("ghOwner").replace(/^https?:\/\/github\.com\//,"").split("/")[0];
    GH.repo   = feld("ghRepo").split("/").pop();
    GH.path   = feld("ghPath") || "Training.json";
    GH.branch = feld("ghBranch") || "main";
    var chk = document.getElementById("ghAuto");
    GH.auto   = chk ? chk.checked : true;
    GH_SHA = null;

    var fehlt = [];
    if(!GH.token) fehlt.push("Token");
    if(!GH.owner) fehlt.push("Konto");
    if(!GH.repo)  fehlt.push("Repository");

    store.set(GHKEY, GH).then(function(){
      render();
      if(fehlt.length) toast("Es fehlt noch: " + fehlt.join(", "));
      else toast("Zugang gespeichert");
    });
    return;
  }
  if(el.id==="ghUp"){
    if(!ghReady()){ toast("Zuerst Zugang speichern"); return; }
    syncUp(false); return;
  }
  if(el.id==="ghDown"){
    if(!ghReady()){ toast("Zuerst Zugang speichern"); return; }
    syncDown(false); return;
  }
  if(el.id==="ghForce"){
    if(!ghReady()){ toast("Zuerst Zugang speichern"); return; }
    if(!confirm("Den Stand von GitHub übernehmen? Nicht hochgeladene Änderungen auf DIESEM Gerät werden dabei überschrieben.")) return;
    ghStatus("Lade herunter …");
    ghFetch().then(function(remote){
      if(!remote || !Array.isArray(remote.sessions)){ toast("Auf GitHub liegt noch keine Datei"); return; }
      S.data = { startDate: remote.startDate || null, sessions: remote.sessions };
      GH.lastSync = new Date().toISOString();
      store.set(GHKEY, GH);
      return persist().then(function(){
        ghStatus("GitHub-Stand übernommen · " + timeShort(new Date()));
        render(); toast("GitHub-Stand übernommen");
      });
    }).catch(function(e){ ghStatus("Fehlgeschlagen: " + e.message); toast(e.message); });
    return;
  }
  if(el.id==="clearBtn"){
    if(confirm("Alle erfassten Einheiten löschen? Das gilt für jedes Gerät mit diesem Login und lässt sich nicht rückgängig machen.")){
      var now=Date.now();
      S.data={startDate:null,sessions:[],updatedAt:now,wipedAt:now};
      S.drafts={};
      clearTimeout(_draftTimer);
      var unit=S.draft?S.draft.unitId:suggestedUnit();
      store.del(DRAFTKEY).then(function(){ return persist(); }).then(function(){
        buildDraft(unit,"A",today());
        if(!ghReady()){ render(); toast("Daten auf diesem Gerät gelöscht"); return; }
        return ghPut(S.data).then(function(){
          GH.lastSync = new Date().toISOString();
          store.set(GHKEY, GH);
          render();
          toast("Alle Daten gelöscht");
        });
      }).catch(function(e){ toast(e && e.message ? e.message : "Löschen fehlgeschlagen"); });
    }
    return;
  }
});

function downloadFile(name, text, mime){
  try{
    var blob=new Blob(["\ufeff"+text],{type:mime});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    return true;
  }catch(e){ return false; }
}

function downloadBackup(){
  var name = "Trainingslog-Sicherung-"+today()+".json";
  if(downloadFile(name, JSON.stringify(S.data,null,1), "application/json")) toast("Sicherung gespeichert");
  else toast("Download nicht möglich");
}

document.addEventListener("change",function(ev){
  if(ev.target.id!=="importFile") return;
  var f=ev.target.files && ev.target.files[0];
  if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result);
      if(!obj || !Array.isArray(obj.sessions)) throw new Error("Format");
      if(!confirm("Sicherung mit "+obj.sessions.length+" Einheiten laden? Die aktuellen Daten auf diesem Gerät werden ersetzt.")) return;
      S.data={startDate:obj.startDate||null, sessions:obj.sessions};
      persist().then(function(){ render(); toast("Sicherung geladen"); });
    }catch(e){ toast("Datei nicht lesbar"); }
  };
  r.readAsText(f);
});

function applyDraftInput(t){
  var v=t.getAttribute && t.getAttribute("data-in");
  if(!v || !S.draft) return false;
  var p=v.split("|"), slot=ensureDraftSlot(p[0], Number(p[1]));
  if(!slot) return false;
  var next=t.value, cur=slot[p[2]];
  if((next===""||next==null) && cur!==""&&cur!=null) return true;
  slot[p[2]] = next;
  return true;
}

document.addEventListener("input",function(ev){
  var t=ev.target;
  if(applyDraftInput(t)){
    patchTraining();
    saveDraftSoon();
    return;
  }
  if(t.id==="dateInput"){
    showUnit(S.draft.unitId, S.draft.stufe, t.value);
    saveDraftSoon();
    render();
    return;
  }
  if(t.id==="exSelect"){ S.verlaufEx=t.value; render(); return; }
});

document.addEventListener("change",function(ev){
  var t=ev.target;
  if(applyDraftInput(t)){
    patchTraining();
    saveDraftSoon();
    return;
  }
  if(t.id==="exSelect"){ S.verlaufEx=t.value; render(); }
});

/* ============================================================
   START
   ============================================================ */
initStorage()
  .then(function(){ return store.get(GHKEY); })
  .then(function(cfg){ if(cfg) GH = Object.assign(GH, cfg); return store.get(KEY); })
  .then(function(saved){
    if(saved && saved.sessions){
      S.data=saved;
      S.data.sessions=mergeSessions(S.data.sessions, S.data.sessions);
    }
    STORE_READY = true;
    return store.get(DRAFTKEY).then(function(d){
      if(d) return d;
      return store.get("gk3:draft-v2");
    });
  })
  .then(function(draft){
    adoptDraftStore(draft);
    if(S.draft && draftValid(S.draft)){
      var u=unitById(S.draft.unitId);
      u.ex.forEach(function(ex){
        var arr=S.draft.entries[ex.id]||[];
        while(arr.length<ex.sets) arr.push({kg:"",reps:"",rir:""});
        S.draft.entries[ex.id]=arr;
      });
      S.draft.entries=hydrateEntries(S.draft.unitId, S.draft.date, S.draft.entries);
      parkDraft();
      S.autosavedAt = new Date();
    } else {
      var unit=suggestedUnit();
      buildDraft(unit,"A",today());
    }
    STORE_READY = true;
    render();
    if(S.draft && draftHasValues(S.draft)) toast("Laufende Einheit wiederhergestellt");
    if(ghReady() && GH.auto) syncUp(true);
  });

/* Beim Verlassen sofort Daten und Entwurf schreiben, nicht nur den Draft. */
function flushOnLeave(){
  persistAllNow();
}
window.addEventListener("pagehide", flushOnLeave);
window.addEventListener("beforeunload", flushOnLeave);
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="hidden"){
    flushOnLeave();
    return;
  }
  if(document.visibilityState==="visible" && ghReady() && GH.auto){
    if(Date.now() - _lastSaveAt < 8000) return;
    syncUp(true);
  }
});
</script>
